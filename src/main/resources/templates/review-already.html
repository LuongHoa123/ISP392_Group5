<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/about.css}">
    <link rel="stylesheet" th:href="@{/css/services.css}">
    <link rel="stylesheet" th:href="@{/css/appointment.css}">
    <link rel="icon" th:href="@{/assets/favicon.ico}" type="image/jpeg">
    <title>Veritas - Sức khỏe tốt và tinh thần minh mẫn là hai phúc lành lớn nhất của cuộc sống</title>
    <style>
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background-color: #1e40af;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s;
        }

        .back-to-top:hover {
            opacity: 0.8;
        }

        .custom-alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .custom-alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        .alert {
            transition: all 0.3s ease-in-out;
        }

        .text-center {
            font-family: 'Arial', sans-serif;
        }


    </style>
    <style>
        .required:after {
            content: '*';
            color: red;
            margin-left: 4px;
        }
    </style>
</head>
<body>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="successModalLabel" style="font-size: 2.2rem; font-weight: bold;">Thành công</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" style="font-size: 2rem;">
                Đánh giá thành công! Cảm ơn bạn đã tin tưởng chúng tôi.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Cập nhật thành công -->
<div class="modal fade" id="updateModal" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="updateModalLabel" style="font-size: 2.2rem; font-weight: bold;">Đã cập nhật</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" style="font-size: 2rem;">
                Cập nhật đánh giá thành công!
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Xóa đánh giá -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="deleteModalLabel" style="font-size: 2.2rem; font-weight: bold;">Đã xóa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" style="font-size: 2rem;">
                Đánh giá đã được xóa thành công.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-warning" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>


<script th:if="${param.success}">
    const successModal = new bootstrap.Modal(document.getElementById('successModal'));
    window.addEventListener('load', () => successModal.show());
</script>

<script th:if="${param.update}">
    const updateModal = new bootstrap.Modal(document.getElementById('updateModal'));
    window.addEventListener('load', () => updateModal.show());
</script>

<script th:if="${param.delete}">
    const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    window.addEventListener('load', () => deleteModal.show());
</script>


<!-- Modal Thông báo Lỗi -->
<div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="errorModalLabel" style="font-size: 2.2rem; font-weight: bold;">Lỗi</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>
            <div class="modal-body" style="font-size: 2rem; font-weight: green;">
                <span th:text="${param.error == 'no_patient' ? 'Không tìm thấy thông tin bệnh nhân.' : 'Email sai!'}"></span>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>
<script th:if="${param.error}">
    const errorModal = new bootstrap.Modal(document.getElementById('errorModal'));
    window.addEventListener('load', () => {
        errorModal.show();
    });
</script>


<th:block th:replace="layout/user-layout :: layout">
    <th:block th:fragment="pageContent">
        <section class="appointment">
            <h1 class="heading">Đánh giá</h1>
            <div class="row">
                <div class="image">
                    <img th:src="@{/assets/appointment.png}" alt="Hình ảnh đặt lịch hẹn">
                </div>

                <style>
                    .input-wrapper {
                        position: relative;
                        width: 100%;
                    }

                    .input-wrapper .required-star {
                        position: absolute;
                        right: 10px;
                        top: 50%;
                        transform: translateY(-50%);
                        color: red;
                        font-size: 20px;
                        pointer-events: none;
                    }

                    .box,
                    .box-half {
                        width: 100%;
                        padding-right: 25px; /* để tránh bị đè lên bởi dấu * */
                    }

                    .box-half-app {
                        display: flex;
                        justify-content: space-between;
                        gap: 10px;
                    }

                    .box-half-app > div {
                        width: 50%;
                    }

                    .rating {
                        direction: rtl;
                        unicode-bidi: bidi-override;
                        display: inline-block;
                    }
                    .rating input {
                        display: none;
                    }
                    .rating label {
                        font-size: 1.5em;
                        color: #ccc;
                        cursor: pointer;
                    }
                    .rating input:checked ~ label,
                    .rating label:hover,
                    .rating label:hover ~ label {
                        color: gold;
                    }

                </style>

                <div class="container mt-5">
                    <h2 class="text-center mb-4">Bạn đã đánh giá lịch hẹn này</h2>
                    <div class="card p-4">

                        <form th:action="@{/patient/review/update}" method="post">
                            <input type="hidden" name="reviewId" th:value="${review.id}"/>

                            <div class="mb-3">
                                <label for="rating" class="form-label"><strong>Số sao:</strong></label>
                                <select name="rating" class="form-control" id="rating" required>
                                    <option th:each="i : ${#numbers.sequence(1, 5)}"
                                            th:value="${i}"
                                            th:selected="${i == review.star}"
                                            th:text="${i + ' ★'}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="content"><strong>Nội dung:</strong></label>
                                <textarea class="form-control" name="content" id="content" rows="4" required
                                          th:text="${review.content}">Nội dung đánh giá...</textarea>
                            </div>

                            <div class="d-flex justify-content-between mt-3">
                                <button type="submit" class="btn btn-success">Cập nhật đánh giá</button>
                            </div>
                        </form>

                        <div class="d-flex justify-content-between mt-3">
                            <a th:href="@{'/patient/review/delete/' + ${review.id}}"
                               class="btn btn-danger"
                               onclick="return confirm('Bạn có chắc muốn xoá đánh giá này không?')">
                                Xoá đánh giá
                            </a>
                        </div>

                        <div class="mt-4 text-center">
                            <a th:href="@{/}" class="btn btn-primary">Quay lại trang chủ</a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </th:block>
</th:block>

<a href="#" class="back-to-top" id="backToTop" title="Lên đầu trang">
    <i class="fas fa-chevron-up"></i>
</a>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dateInput = document.getElementById('appointmentDate');
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        const yyyy = tomorrow.getFullYear();
        const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
        const dd = String(tomorrow.getDate()).padStart(2, '0');
        const minDateStr = `${yyyy}-${mm}-${dd}`;

        dateInput.min = minDateStr;
    });
</script>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const backToTopBtn = document.getElementById("backToTop");

        window.addEventListener("scroll", function () {
            if (window.scrollY > 300) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }
        });

        backToTopBtn.addEventListener("click", function (e) {
            e.preventDefault();
            window.scrollTo({top: 0, behavior: "smooth"});
        });
    });
</script>

<style>
    .italic-placeholder::placeholder {
        font-style: italic;
    }
</style>

</body>
</html>
