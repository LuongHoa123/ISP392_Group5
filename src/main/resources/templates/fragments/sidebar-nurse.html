<th:block th:fragment="sidebar">
    <nav class="sidebar sidebar-offcanvas" id="sidebar">
        <ul class="nav">
            <li class="nav-item nav-profile">
                <a href="#" class="nav-link">
                    <div class="nav-profile-image">
                        <!-- Nếu có avatar -->
                        <img th:if="${session.avatar != null}" th:src="@{${session.avatar}}" alt="profile">

                        <!-- Nếu không có avatar -->
                        <img th:unless="${session.avatar != null}" th:src="@{/assets_admin/images/faces/face3.jpg}" alt="profile">

                        <span class="login-status online"></span>
                    </div>
                    <div class="nav-profile-text d-flex flex-column">
                        <span class="font-weight-bold mb-2" th:text="${session.fullName}"></span>
                        <span class="text-secondary text-small" th:text="${session.specialization}"></span>
                    </div>
                    <i class="mdi mdi-bookmark-check text-success nav-profile-badge"></i>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/nurse/dashboard}">
                    <span class="menu-title">Dashboard</span>
                    <i class="mdi mdi-view-dashboard menu-icon"></i>
                </a>
            </li>


            <li class="nav-item">
                <a class="nav-link" th:href="@{/nurse/shift}">
                    <span class="menu-title">Ca trực của tôi</span>
                    <i class="mdi mdi-calendar-clock menu-icon"></i>
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" th:href="@{/nurse/patient}">
                    <span class="menu-title">Danh sách bệnh nhân</span>
                    <i class="mdi mdi-account-search menu-icon"></i> <!-- search person icon -->
                </a>
            </li>

        </ul>
    </nav>
</th:block>
