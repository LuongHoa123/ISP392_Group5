<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Purple Recep</title>
    <!-- plugins:css -->
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
</head>
<body>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-primary text-white me-2">
                <i class="mdi mdi-home"></i>
              </span> Trang chủ bác sĩ
            </h3>
            <nav aria-label="breadcrumb">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item active" aria-current="page">
                        <span></span>Tổng quan <i
                            class="mdi mdi-alert-circle-outline icon-sm text-primary align-middle"></i>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="row mt-4 justify-content-center align-items-center" style="min-height: 40vh;">
            <div class="col-lg-4 col-md-6 col-12 mb-4 d-flex align-items-stretch justify-content-center">
                <a th:href="@{/doctor/dashboard/patients?status=1}" style="text-decoration:none; width:100%;">
                <div class="card bg-info text-dark w-100 h-100 shadow rounded-4" style="min-height: 160px;">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <i class="mdi mdi-account-check mdi-48px mb-2"></i>
                        <h5 class="card-title mb-1 text-center">Bệnh nhân đã khám trong tháng</h5>
                        <p class="card-text mb-0 text-center" style="font-size:2rem; font-weight:bold;" th:text="${daKham}">0</p>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-lg-4 col-md-6 col-12 mb-4 d-flex align-items-stretch justify-content-center">
                <a th:href="@{/doctor/dashboard/patients?status=2}" style="text-decoration:none; width:100%;">
                <div class="card text-danger w-100 h-100 shadow rounded-4" style="background: linear-gradient(135deg, #ffe5e5, #ffb3b3); border:1px solid #f5c6cb; min-height: 160px;">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center">
                        <i class="mdi mdi-account-alert mdi-48px mb-2"></i>
                        <h5 class="card-title mb-1 text-center">Bệnh nhân chưa khám trong tháng</h5>
                        <p class="card-text mb-0 text-center" style="font-size:2rem; font-weight:bold;" th:text="${chuaKham}">0</p>
                    </div>
                </div>
                </a>
            </div>
            <div class="col-lg-4 col-md-6 col-12 mb-4 d-flex align-items-stretch justify-content-center">
                <a th:href="@{/doctor/dashboard/shifts}" style="text-decoration:none; width:100%;">
                    <div class="card text-white w-100 h-100 shadow rounded-4" style="background: linear-gradient(135deg, #6a11cb, #2575fc); min-height: 160px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <i class="mdi mdi-calendar-clock mdi-48px mb-2"></i>
                            <h5 class="card-title mb-1 text-center">Ca trực trong tháng</h5>
                            <p class="card-text mb-0 text-center" style="font-size:2rem; font-weight:bold;" th:text="${soCaTrucThang}">0</p>
                        </div>
                    </div>
                </a>
            </div>
        </div> <!-- Kết thúc row các card thống kê -->
        <div class="row mt-5 justify-content-center">
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <canvas id="barChartPatients" height="200"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <canvas id="pieChartPatients" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
        <script th:inline="javascript">
            var patientsByWeek = [[${patientsByWeek}]];
            var weekLabels = patientsByWeek.map(function(_, i) { return 'Tuần ' + (i+1); });
            var daKham = [[${daKham}]];
            var chuaKham = [[${chuaKham}]];
            new Chart(document.getElementById('barChartPatients'), {
                type: 'bar',
                data: {
                    labels: weekLabels,
                    datasets: [{
                        label: 'Số bệnh nhân đã khám',
                        data: patientsByWeek,
                        backgroundColor: '#4CAF50'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {display: false},
                        datalabels: {
                            anchor: 'end',
                            align: 'top',
                            font: {weight: 'bold', size: 18},
                            color: '#333',
                            formatter: function(value) { return value; }
                        }
                    },
                    scales: {y: {beginAtZero: true}}
                },
                plugins: [ChartDataLabels]
            });
            // Pie chart
            new Chart(document.getElementById('pieChartPatients'), {
                type: 'pie',
                data: {
                    labels: ['Đã khám', 'Chưa khám'],
                    datasets: [{
                        data: [daKham, chuaKham],
                        backgroundColor: ['#4CAF50', '#FF9800']
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        datalabels: {
                            color: '#fff',
                            font: {weight: 'bold', size: 18},
                            formatter: function(value) { return value; }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        </script>
    </th:block>
</th:block>

<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/vendors/chart.js/Chart.min.js}"></script>
<script th:src="@{/assets_admin/js/jquery.cookie.js}" type="text/javascript"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script th:src="@{/assets_admin/js/hoverable-collapse.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
<script th:src="@{/assets_admin/js/dashboard.js}"></script>
<script th:src="@{/assets_admin/js/todolist.js}"></script>
</body>
</html>
