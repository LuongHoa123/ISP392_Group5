<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đổi thông tin cá nhân bác sĩ</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
    <!-- Styling: Customizes font sizes and button styles for the doctor profile update form -->
    <style>
        body, .form-control, .btn, .card-title, .page-title, label {
            font-size: 1rem !important; /* Giảm cỡ chữ nhỏ hơn mặc định một chút */
        }
        .btn-warning {
            background-color: #28a745 !important; /* Green background for change password button */
            border-color: #28a745 !important;
            color: #fff !important;
        }
    </style>
</head>

<body>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <!-- Page header: Displays the title and a button to navigate to the password change page -->
        <div class="page-header d-flex justify-content-between align-items-center">
            <h3 class="page-title">Đổi thông tin cá nhân bác sĩ</h3>
            <a class="btn btn-warning" th:href="@{/changePass}">Đổi mật khẩu</a>
        </div>

        <!-- Profile update form container: Contains the form for updating doctor profile information -->
        <div class="row">
            <div class="col-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Thông tin của tôi</h4>
                        <!-- Success message: Displays a success alert when profile update is successful -->
                        <div th:if="${param.success}" class="alert alert-success" role="alert">
                            Cập nhật thông tin thành công!
                        </div>

                        <!-- Error message: Displays an error alert if the phone number is duplicated -->
                        <div th:if="${param.phone}" class="alert alert-danger" role="alert">
                            Số điện thoại bị trùng!
                        </div>

                        <!-- Profile update form: Allows doctors to update their first name, last name, phone number, and certificate file -->
                        <form id="updateProfileForm" th:action="@{/doctor/profile/save}" th:object="${doctor}"
                              method="post" enctype="multipart/form-data">
                            <div class="row">
                                <!-- Bên trái: Avatar -->
                                <div class="col-md-4 text-center">
                                    <label class="font-weight-bold">Ảnh đại diện</label>
                                    <input type="file" id="avatarFile" name="avatarFile" accept="image/*" class="form-control mb-3"/>

                                    <!-- Nếu có ảnh -->
                                    <img id="avatarPreview"
                                         th:if="${doctor.avatar != null}"
                                         th:src="@{${doctor.avatar}}"
                                         alt="Preview avatar"
                                         style="max-width: 100%; border-radius: 8px; display: block; margin: auto;"/>

                                    <!-- Nếu chưa có ảnh -->
                                    <img id="avatarPreviewEmpty"
                                         th:if="${doctor.avatar == null}"
                                         src="#"
                                         alt="Preview avatar"
                                         style="max-width: 100%; border-radius: 8px; display: none; margin: auto;"/>
                                </div>

                                <!-- Bên phải: Thông tin cá nhân -->
                                <div class="col-md-8">
                                    <div class="form-group">
                                        <label for="firstName">Họ <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{firstName}" name="firstName"
                                               placeholder="Họ" required>
                                        <div id="firstNameError" class="text-danger"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="lastName">Tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{lastName}" name="lastName"
                                               placeholder="Tên" required>
                                        <div id="lastNameError" class="text-danger"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="phoneNumber">Số điện thoại <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}" name="phoneNumber"
                                               placeholder="Số điện thoại" required>
                                        <div id="phoneError" class="text-danger"></div>
                                    </div>

                                    <div class="form-group">
                                        <label>Email (không thể sửa)</label>
                                        <input type="email" class="form-control" th:value="*{email}" name="email" readonly>
                                    </div>

                                    <div class="form-group">
                                        <label class="font-weight-bold mb-2">
                                            Chứng chỉ hành nghề (PDF) <span class="text-danger">*</span>
                                        </label>
                                        <div class="border rounded p-3 bg-light">
                                            <input type="file" class="form-control-file mb-2" name="certificateFile" accept="application/pdf">
                                            <div th:if="${doctor.certificateFileName != null}">
                                                <a class="btn btn-sm btn-info" th:href="@{/doctor/certificate/view}" target="_blank">Xem chứng chỉ</a>
                                            </div>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary">Lưu</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<!-- External scripts: Load vendor bundle and miscellaneous JavaScript for form functionality -->
<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
<script>
    // Initialize form validation when the DOM is fully loaded
    // @param {Event} event - The DOMContentLoaded event
    // @returns {void}
    document.addEventListener("DOMContentLoaded", function (event) {
        const form = document.querySelector("#updateProfileForm");

        // Validate form inputs before submission
        // @param {Event} event - The submit event of the form
        // @returns {void}
        form.addEventListener("submit", function (event) {
            let isValid = true;
            let message = "";

            // Clear previous error messages
            document.getElementById('firstNameError').textContent = '';
            document.getElementById('lastNameError').textContent = '';
            document.getElementById('phoneError').textContent = '';

            // Validate first name
            const firstName = document.querySelector("[name='firstName']").value.trim();
            const namePattern = /^[a-zA-Z\s]+$/;
            if (!firstName) {
                document.getElementById('firstNameError').textContent = 'Họ không được để trống.';
                isValid = false;
            }

            // Validate last name
            const lastName = document.querySelector("[name='lastName']").value.trim();
            if (!lastName) {
                document.getElementById('lastNameError').textContent = 'Tên không được để trống.';
                isValid = false;
            } else if (!namePattern.test(lastName)) {
                document.getElementById('lastNameError').textContent = 'Tên không hợp lệ. Chỉ cho phép chữ.';
                isValid = false;
            }

            // Validate phone number
            const phoneNumber = document.querySelector("[name='phoneNumber']").value.trim();
            const phonePattern = /^0\d{9}$/;
            if (!phoneNumber) {
                document.getElementById('phoneError').textContent = 'Số điện thoại không được để trống.';
                isValid = false;
            } else if (!phonePattern.test(phoneNumber)) {
                document.getElementById('phoneError').textContent = 'Số điện thoại không hợp lệ. Phải bắt đầu bằng số 0 và có 10 chữ số.';
                isValid = false;
            }

            // Prevent form submission if validation fails
            if (!isValid) {
                event.preventDefault();
            }
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
        const avatarInput = document.getElementById('avatarFile');
        const avatarPreview = document.getElementById('avatarPreview');

        avatarInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    avatarPreview.src = e.target.result;
                    avatarPreview.style.display = 'block';
                };

                reader.readAsDataURL(file);
            } else {
                avatarPreview.src = '#';
                avatarPreview.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
