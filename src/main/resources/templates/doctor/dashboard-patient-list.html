<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Danh sách bệnh nhân</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 class="mb-3" th:text="${title}">Danh sách bệnh nhân</h3>
            <div class="card">
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Họ tên bệnh nhân</th>
                            <th>Thời gian hẹn</th>
                            <th>Lý do khám</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appt, iterStat : ${appointments}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${appt.name}"></td>
                            <td th:text="${#temporals.format(appt.appointmentDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${appt.reason}"></td>
                            <td>
                                <span th:switch="${appt.status}">
                                    <span th:case="-1" class="badge badge-warning">Chờ xác nhận</span>
                                    <span th:case="0" class="badge badge-danger">Đã huỷ</span>
                                    <span th:case="1" class="badge badge-success">Đã khám</span>
                                    <span th:case="2" class="badge badge-info">Đang chờ khám</span>
                                    <span th:case="*">Không rõ</span>
                                </span>
                            </td>
                            <td>
                                <a th:href="@{/doctor/appointment/detail/{id}(id=${appt.id})}" class="btn btn-sm btn-info">Xem chi tiết</a>
                            </td>
                            <td>
                                <form th:action="@{/doctor/patient/delete-appointment/{appointmentId}(appointmentId=${appt.id})}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa lịch sử khám này?');">
                                    <input type="hidden" name="id" th:value="${appt.patient != null ? appt.patient.id : 0}" />
                                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${appointments.size() == 0}">
                            <td colspan="7" class="text-center">Không có bệnh nhân nào.</td>
                        </tr>
                        </tbody>
                    </table>
                    <!-- Phân trang -->
                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination justify-content-center mt-3">
                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/doctor/dashboard/patients(status=1, page=${currentPage - 1})}">Trước</a>
                            </li>
                            <li class="page-item"
                                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/doctor/dashboard/patients(status=1, page=${i})}"
                                   th:text="${i + 1}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/doctor/dashboard/patients(status=1, page=${currentPage + 1})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                    <a th:href="@{/doctor/dashboard}" class="btn btn-danger mt-3">Quay lại</a>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</body>
</html>
