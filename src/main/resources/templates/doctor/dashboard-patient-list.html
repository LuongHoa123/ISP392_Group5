<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Danh sách bệnh nhân</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 class="mb-3" th:text="${title}">Danh sách bệnh nhân</h3>
            <div class="card">
                <div class="card-body">
                    <table class="table table-bordered">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Họ tên bệnh nhân</th>
                            <th>Thời gian hẹn</th>
                            <th>Lý do khám</th>
                            <th>Trạng thái</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="appt, iterStat : ${appointments}">
                            <td th:text="${iterStat.index + 1}"></td>
                            <td th:text="${appt.name}"></td>
                            <td th:text="${#temporals.format(appt.appointmentDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="${appt.reason}"></td>
                            <td>
                                <span th:switch="${appt.status}">
                                    <span th:case="-1" class="badge badge-warning">Chờ xác nhận</span>
                                    <span th:case="0" class="badge badge-danger">Đã huỷ</span>
                                    <span th:case="1" class="badge badge-success">Đã khám</span>
                                    <span th:case="2" class="badge badge-info">Đang chờ khám</span>
                                    <span th:case="*">Không rõ</span>
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${appointments.size() == 0}">
                            <td colspan="5" class="text-center">Không có bệnh nhân nào.</td>
                        </tr>
                        </tbody>
                    </table>
                    <a th:href="@{/doctor/dashboard}" class="btn btn-danger mt-3">Quay lại</a>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</body>
</html>
