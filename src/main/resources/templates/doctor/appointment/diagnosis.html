<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chuẩn đoán - Lịch hẹn</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        <div th:if="${param.save}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Thêm thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.update}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Cập nhật thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.delete}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Xoá thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${error}" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${error}">
                    Có lỗi xảy ra!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 class="mb-3">Chuẩn đoán cho bệnh nhân: <span th:text="${appointment.name}"></span></h3>

            <!-- Form thêm chuẩn đoán -->
            <form th:action="@{/doctor/appointment/diagnosis/{appointmentId}/add(appointmentId=${appointment.id})}" method="post"
                  th:if="${appointment.status != 1}">
                <div class="form-group">
                    <label for="content">Nội dung chuẩn đoán:</label>
                    <textarea id="content" class="form-control" name="content" required></textarea>
                </div>
                <div class="form-group">
                    <label for="level">Mức độ:</label>
                    <select id="level" class="form-control" name="level" required>
                        <option value="1">Nhẹ</option>
                        <option value="2">Trung bình</option>
                        <option value="3">Nặng</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Thêm chuẩn đoán</button>
            </form>


            <h4 class="mt-4">Danh sách chuẩn đoán</h4>

            <!-- Bảng danh sách chuẩn đoán -->
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nội dung</th>
                    <th>Mức độ</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="diagnosis, iterStat : ${diagnoses}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${diagnosis.content}"></td>
                    <td th:text="${diagnosis.level == 1 ? 'Nhẹ' : diagnosis.level == 2 ? 'Trung bình' : 'Nặng'}"></td>
                    <td>
                        <!-- Nút cập nhật -->
                        <button type="button" class="btn btn-warning btn-sm ml-2"
                                th:data-id="${diagnosis.id}"
                                th:data-content="${diagnosis.content}"
                                th:data-level="${diagnosis.level}"
                                th:onclick="|editDiagnosis(this)|"
                                th:if="${appointment.status != 1}">
                            Cập nhật
                        </button>

                        <!-- Nút xóa -->
                        <a th:href="@{/doctor/appointment/diagnosis/{appointmentId}/delete/{diagnosisId}(appointmentId=${appointment.id}, diagnosisId=${diagnosis.id})}"
                           class="btn btn-danger btn-sm ml-2"
                           th:if="${appointment.status != 1}">
                            Xóa
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Form cập nhật chuẩn đoán -->
            <div id="editForm" style="display:none;">
                <h4 class="mt-4">Cập nhật chuẩn đoán</h4>
                <form th:action="@{/doctor/appointment/diagnosis/update}" method="post">
                    <input type="hidden" id="diagnosisId" name="diagnosisId">
                    <div class="form-group">
                        <label for="editContent">Nội dung chuẩn đoán:</label>
                        <textarea id="editContent" class="form-control" name="content" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="editLevel">Mức độ:</label>
                        <select id="editLevel" class="form-control" name="level" required>
                            <option value="1">Nhẹ</option>
                            <option value="2">Trung bình</option>
                            <option value="3">Nặng</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning">Cập nhật</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Hủy</button>
                </form>
            </div>
        </div>
    </th:block>
</th:block>

<script>
    function editDiagnosis(button) {
        let id = button.getAttribute('data-id');
        let content = button.getAttribute('data-content');
        let level = button.getAttribute('data-level');

        document.getElementById('diagnosisId').value = id;
        document.getElementById('editContent').value = content;
        document.getElementById('editLevel').value = level;

        document.getElementById('editForm').style.display = 'block';
    }


    function cancelEdit() {
        document.getElementById('editForm').style.display = 'none';
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'))
        toastElList.forEach(function (toastEl) {
            var toast = new bootstrap.Toast(toastEl)
            toast.show()
        })
    });
</script>
</body>
</html>
