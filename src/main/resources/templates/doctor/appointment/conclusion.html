<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết luận - Lịch khám</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        <div th:if="${param.save}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Thêm thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.update}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Cập nhật thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.delete}" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Xoá thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.conflict}" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${param.conflict}">
                    Có lỗi xảy ra!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 class="mb-3">Kết luận cho lịch khám của <span th:text="${appointment.name}"></span></h3>

            <div th:if="${conclusion.id != null}">
                <h4>Kết luận hiện tại:</h4>
                <p><strong>Nội dung kết luận:</strong> <span th:text="${conclusion.content}"></span></p>
                <p><strong>Đơn thuốc:</strong> <span th:text="${conclusion.prescription}"></span></p>
            </div>

            <div th:if="${conclusion.id == null}">
                <form th:action="@{/doctor/appointment/conclusion/{id}(id=${appointment.id})}" method="post">
                    <div class="form-group">
                        <label for="content">Nội dung kết luận:</label>
                        <textarea id="content" class="form-control" name="content" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="prescription">Đơn thuốc:</label>
                        <textarea id="prescription" class="form-control" name="prescription"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Lưu kết luận</button>
                </form>
            </div>

            <a href="#" class="btn btn-secondary mt-3" th:href="@{/doctor/appointment}">Quay lại</a>
        </div>
    </th:block>
</th:block>
</body>
</html>
