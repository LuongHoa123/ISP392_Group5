<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết bệnh nhân</title>
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<th:block th:replace="layout/doctor-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3>Chi tiết bệnh nhân</h3>

            <div class="card mb-4">
                <div class="card-body">
                    <p><strong>Họ:</strong> <span th:text="${patient.firstName}"></span></p>
                    <p><strong>Tên:</strong> <span th:text="${patient.lastName}"></span></p>
                    <p><strong>Ngày sinh:</strong> <span th:text="${#temporals.format(patient.dateOfBirth, 'dd/MM/yyyy')}"></span></p>
                    <p><strong>Giới tính:</strong>
                        <span th:text="${patient.gender == 'MALE' ? 'Nam' : 'Nữ'}"></span>
                    </p>
                    <p><strong>Địa chỉ:</strong> <span th:text="${patient.address} ?: '---'"></span></p>
                    <p><strong>Số điện thoại:</strong> <span th:text="${patient.phone}"></span></p>
                </div>
            </div>

            <h4>Lịch sử khám bệnh</h4>
            <div style="overflow-x: auto;">
            <table class="table table-bordered" style="min-width: 900px;">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Thời gian hẹn</th>
                    <th>Lý do khám</th>
                    <th>Phòng</th>
                    <th>Trạng thái</th>
                    <th>Đơn thuốc</th>
                    <th>Nội dung kết luận</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt, iterStat : ${appointments}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${#temporals.format(appt.appointmentDateTime, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${appt.reason}"></td>
                    <td th:text="${appt.roomName != null ? appt.roomName : '---'}"></td>
                    <td>
                        <span th:switch="${appt.status}">
                            <span th:case="-1" class="badge badge-warning">Chờ xác nhận</span>
                            <span th:case="0" class="badge badge-danger">Đã huỷ</span>
                            <span th:case="1" class="badge badge-success">Đã khám</span>
                            <span th:case="2" class="badge badge-info">Đang chờ khám</span>
                            <span th:case="*">Không rõ</span>
                        </span>
                    </td>
                    <td style="white-space: pre-line; word-break: break-word; max-width: 350px;">
                        <span th:text="${appt.prescription != null && !#strings.isEmpty(appt.prescription) ? appt.prescription : 'Không có'}"></span>
                    </td>
                    <td style="white-space: pre-line; word-break: break-word; max-width: 250px;">
                        <span th:text="${appt.conclusionContent != null && !#strings.isEmpty(appt.conclusionContent) ? appt.conclusionContent : 'Không có'}"></span>
                    </td>
                    <td>
                        <form th:action="@{/doctor/patient/delete-appointment/{appointmentId}(appointmentId=${appt.id})}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa lịch sử khám này?');">
                            <input type="hidden" name="id" th:value="${patient.id}" />
                            <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${appointments.size() == 0}">
                    <td colspan="8" class="text-center">Chưa có lịch sử khám</td>
                </tr>
                </tbody>
            </table>
            </div>

            <!-- Phân trang -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mt-3">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/doctor/patient/detail(id=${patient.id}, page=${currentPage - 1})}">Trước</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/doctor/patient/detail(id=${patient.id}, page=${i})}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/doctor/patient/detail(id=${patient.id}, page=${currentPage + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>

            <a th:href="@{/doctor/patient}" class="btn btn-danger mt-3 mr-2">Quay lại</a>
            <a th:href="@{/doctor/patient/detail(id=${patient.id}, page=0)}" class="btn btn-primary mt-3">Reset</a>
            <a th:href="@{/doctor/patient/export-pdf-detail(id=${patient.id})}" class="btn btn-success mt-3 ml-2">Xuất PDF</a>
        </div>
    </th:block>
</th:block>
</body>
</html>
