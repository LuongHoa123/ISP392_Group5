<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết luận - Lịch khám</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> </head>
<body class="bg-gray-100">

<th:block th:replace="layout/recep-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mx-auto my-8 px-4 sm:px-6 lg:px-8">

            <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="p-6 sm:p-8">

                    <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 pb-4 border-b border-gray-200">
                        <h2 class="text-3xl font-bold text-gray-800 mb-4 sm:mb-0">
                            Chi tiết Lịch Khám
                        </h2>
                        <a th:href="@{'/recep/appointment/generatePdf/' + ${appointment.id}}"
                           class="flex items-center justify-center px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-75 transition duration-200"
                           target="_blank">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 4v3H4a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V9a2 2 0 00-2-2h-1V4a2 2 0 00-2-2H7a2 2 0 00-2 2zm8 0H7v3h6V4zm0 8H7v4h6v-4z" clip-rule="evenodd" />
                            </svg>
                            In Phiếu Khám
                        </a>
                    </div>

                    <div class="mb-8 p-4 bg-gray-50 border border-gray-200 rounded-lg">
                        <h3 class="text-lg font-semibold text-gray-700 mb-2">Chẩn đoán sơ bộ</h3>
                        <p class="text-gray-800" th:text="${appointment.diagnosis.content}">Initial diagnosis content here.</p>
                    </div>

                    <div class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4">Thông tin bệnh nhân</h3>
                        <dl class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-4 text-sm">
                            <div class="flex flex-col">
                                <dt class="font-medium text-gray-500">Họ và tên</dt>
                                <dd class="text-gray-900 font-semibold" th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></dd>
                            </div>
                            <div class="flex flex-col">
                                <dt class="font-medium text-gray-500">Ngày sinh</dt>
                                <dd class="text-gray-900" th:text="${#temporals.format(appointment.patient.dateOfBirth, 'dd/MM/yyyy')}"></dd>
                            </div>
                            <div class="flex flex-col">
                                <dt class="font-medium text-gray-500">Giới tính</dt>
                                <dd class="text-gray-900">
                                    <th:block th:switch="${appointment.patient.gender?.name()}">
                                        <span th:case="'MALE'">Nam</span>
                                        <span th:case="'FEMALE'">Nữ</span>
                                        <span th:case="*">Không xác định</span>
                                    </th:block>
                                </dd>
                            </div>
                            <div class="flex flex-col">
                                <dt class="font-medium text-gray-500">Số điện thoại</dt>
                                <dd class="text-gray-900" th:text="${appointment.patient.phone}"></dd>
                            </div>
                            <div class="flex flex-col md:col-span-2">
                                <dt class="font-medium text-gray-500">Địa chỉ</dt>
                                <dd class="text-gray-900" th:text="${appointment.patient.address} ?: '---'"></dd>
                            </div>
                        </dl>
                    </div>

                    <div th:if="${!appointmentServices.isEmpty()}" class="mb-8">
                        <h3 class="text-xl font-semibold text-gray-800 mb-4">Dịch vụ đã sử dụng</h3>
                        <div class="overflow-x-auto border border-gray-200 rounded-lg">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên dịch vụ</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nội dung</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Giá</th>
                                </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200">
                                <tr th:each="as, iterStat : ${appointmentServices}" class="hover:bg-gray-50 transition-colors">
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${iterStat.count}"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${as.service.content}"></td>
                                    <td class="px-6 py-4 text-sm text-gray-600" th:text="${as.content}"></td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 text-right" th:text="${#numbers.formatDecimal(as.service.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div th:if="${conclusion.id != null}" class="bg-blue-50 text-blue-900 p-6 rounded-lg border border-blue-200">
                        <h3 class="text-xl font-semibold text-blue-900 mb-4">Kết luận cuối cùng</h3>
                        <div class="space-y-3">
                            <div>
                                <strong class="font-medium">Nội dung kết luận:</strong>
                                <p class="mt-1" th:text="${conclusion.content}"></p>
                            </div>
                            <div>
                                <strong class="font-medium">Đơn thuốc:</strong>
                                <p class="mt-1" th:text="${conclusion.prescription}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 text-right">
                        <a th:href="@{/recep/appointment}"
                           class="inline-block px-6 py-2 bg-gray-200 text-gray-800 font-medium rounded-lg hover:bg-gray-300 transition duration-200">
                            Quay lại
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

</body>
</html>
