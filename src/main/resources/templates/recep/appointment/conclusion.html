<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết luận - Lịch khám</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

<th:block th:replace="layout/recep-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mx-auto mt-8 px-4 sm:px-6 lg:px-8 max-w-4xl">
            <h3 class="mb-4 text-2xl font-bold text-gray-800">Chuẩn đoán sơ qua: <span th:text="${appointment.diagnosis.content}" class="text-gray-600"></span></h3>

            <a th:href="@{'/recep/appointment/generatePdf/' + ${appointment.id}}"
               class="btn btn-sm btn-primary" target="_blank">
                In Phiếu
            </a>

            <h3>Chi tiết bệnh nhân</h3>

            <div class="card mb-4">
                <div class="card-body">
                    <p><strong>Họ:</strong> <span th:text="${appointment.patient.firstName}"></span></p>
                    <p><strong>Tên:</strong> <span th:text="${appointment.patient.lastName}"></span></p>
                    <p><strong>Ngày sinh:</strong> <span th:text="${#temporals.format(appointment.patient.dateOfBirth, 'dd/MM/yyyy')}"></span></p>
                    <p>
                        <strong>Giới tính:</strong>
                        <th:block th:switch="${appointment.patient.gender?.name()}">
                            <span th:case="'MALE'">Nam</span>
                            <span th:case="'FEMALE'">Nữ</span>
                            <span th:case="*">Không xác định</span>
                        </th:block>
                    </p>
                    <p><strong>Địa chỉ:</strong> <span th:text="${appointment.patient.address} ?: '---'"></span></p>
                    <p><strong>Số điện thoại:</strong> <span th:text="${appointment.patient.phone}"></span></p>
                </div>
            </div>

            <h3 class="mb-6 text-2xl font-bold text-gray-800">Kết luận cho lịch khám</h3>

            <div th:if="${appointmentServices.size() > 0}" class="bg-white shadow-md rounded-lg p-6 mb-6">
                <h4 class="text-xl font-semibold text-gray-700 mb-4">Danh sách dịch vụ đã sử dụng</h4>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">#</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên dịch vụ</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nội dung dịch vụ</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Giá</th>
                        </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="as, iterStat : ${appointmentServices}" class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${iterStat.count}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${as.service.content}"></td>
                            <td class="px-6 py-4 text-sm text-gray-500" th:text="${as.content}"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${as.service.price} + ' VND'"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${conclusion.id != null}" class="bg-white shadow-md rounded-lg p-6 mb-6">
                <h4 class="text-xl font-semibold text-gray-700 mb-4">Kết luận hiện tại:</h4>
                <p class="mb-2"><strong class="text-gray-900">Nội dung kết luận:</strong> <span th:text="${conclusion.content}" class="text-gray-600"></span></p>
                <p class="mb-2"><strong class="text-gray-900">Đơn thuốc:</strong> <span th:text="${conclusion.prescription}" class="text-gray-600"></span></p>
            </div>

            <a href="#" class="inline-block mt-3 px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition duration-200" th:href="@{/recep/appointment}">Quay lại</a>
        </div>
    </th:block>
</th:block>
</body>
</html>
