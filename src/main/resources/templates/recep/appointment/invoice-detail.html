<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
            font-weight: 500;
            padding: 15px;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(0, 128, 0, 0.1);
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 5px;
            font-weight: 500;
            padding: 15px;
            font-size: 16px;
            box-shadow: 0 2px 6px rgba(255, 0, 0, 0.1);
        }

        .alert {
            background-color: transparent;
            width: 60%;
            margin: 0 auto;
            margin-top: 0;
            text-align: center;
            position: relative;
            top: 85px;
        }


    </style>
</head>
<body>
<div th:if="${successMessage}" class="alert alert-success text-center mt-3" role="alert" th:text="${successMessage}">
</div>

<div th:if="${errorMessage}" class="alert alert-danger text-center mt-3" role="alert" th:text="${errorMessage}">
</div>

<th:block th:replace="layout/recep-layout :: layout">
    <th:block th:fragment="pageContent">
        <th:block th:replace="layout/recep-layout :: layout">
            <th:block th:fragment="pageContent">
                <div class="container mt-4">
                    <h3 class="mb-3">Kết quả thanh toán</h3>

                    <!-- Hiển thị thông báo -->
                    <div th:if="${success}" class="alert alert-success text-center">
                        Thanh toán thành công!
                    </div>

                    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

                    <!-- Nếu thanh toán thành công, hiển thị chi tiết hóa đơn -->
                    <div th:if="${invoice != null}">
                        <div class="card mt-3">
                            <div class="card-header bg-success text-white">
                                Chi tiết hóa đơn
                            </div>
                            <div class="card-body">
                                <p><strong>Mã giao dịch:</strong> <span th:text="${invoice.vnpTxtRef}"></span></p>
                                <p><strong>Người thanh toán:</strong> <span th:text="${invoice.fullName}"></span></p>
                                <p><strong>Số điện thoại:</strong> <span th:text="${invoice.phone}"></span></p>
                                <p><strong>Số tiền:</strong> <span th:text="${invoice.totalCost}"></span> VND</p>
                                <p><strong>Ngày thanh toán:</strong>
                                    <span th:text="${#temporals.format(invoice.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                                </p>
                                <p><strong>Lễ tân xử lý:</strong>
                                    <span th:text="${invoice.recep.firstName + ' ' + invoice.recep.lastName}"></span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <a href="/recep/dashboard" class="btn btn-secondary">Quay về trang chính</a>
                    </div>
                </div>
            </th:block>
        </th:block>

    </th:block>
</th:block>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


<script>
    setTimeout(function () {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => alert.style.display = 'none');
    }, 4000);
</script>


</body>
</html>
