<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/about.css}">
    <link rel="stylesheet" th:href="@{/css/services.css}">
    <link rel="icon" th:href="@{/assets/favicon.ico}" type="image/jpeg">
</head>
<title>MediHeart - Good health and good sense are two of life's greatest blessings</title>
</head>
<body>

<div th:replace="fragments/header-user :: header"></div>


<th:block th:insert="~{::pageContent}"></th:block>


<div th:replace="fragments/footer-user :: footer"></div>

<a href="#" class="back-to-top" id="backToTop" title="Lên đầu trang">
    <i class="fas fa-chevron-up"></i>
</a>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const backToTopBtn = document.getElementById("backToTop");

        // Ẩn/hiện nút khi scroll
        window.addEventListener("scroll", function () {
            if (window.scrollY > 300) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }
        });

        // Cuộn mượt về đầu trang khi click
        backToTopBtn.addEventListener("click", function (e) {
            e.preventDefault();
            window.scrollTo({top: 0, behavior: "smooth"});
        });

        // Show registration success modal if registration was successful
        if (document.getElementById('registrationSuccessModal')) {
            $('#registrationSuccessModal').modal('show');
        }
    });
</script>

</body>
</html>
