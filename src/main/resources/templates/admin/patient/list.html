<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Danh sách bệnh nhân</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <style>
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 15px;
            font-size: 0.9rem;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            margin-right: 6px;
        }
    </style>
</head>

<body>
<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header">
            <h3 class="page-title">Danh sách bệnh nhân</h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Danh sách bệnh nhân</li>
                </ol>
            </nav>
        </div>

        <div class="row">
            <div class="col-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Danh sách bệnh nhân</h4>
                        
                        <!-- Search Form -->
                        <form th:action="@{/admin/patient}" method="get" class="form-inline mb-3">
                            <div class="form-group mr-2">
                                <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Tìm kiếm theo tên...">
                            </div>
                            <button type="submit" class="btn btn-primary mr-2">
                                <i class="mdi mdi-magnify"></i> Tìm kiếm
                            </button>
                        </form>

                        <!-- Table -->
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Họ</th>
                                        <th>Tên</th>
                                        <th>Email</th>
                                        <th>Số điện thoại</th>
                                        <th>Giới tính</th>
                                        <th>Ngày sinh</th>
                                        <th>Địa chỉ</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="patient, iterStat : ${patients}">
                                        <td th:text="${iterStat.count}"></td>
                                        <td th:text="${patient.firstName}"></td>
                                        <td th:text="${patient.lastName}"></td>
                                        <td th:text="${patient.user != null ? patient.user.email : ''}"></td>
                                        <td th:text="${patient.phone}"></td>
                                        <td th:text="${patient.gender != null ? (patient.gender.name() == 'MALE' ? 'Nam' : 'Nữ') : '---'}"></td>
                                        <td th:text="${patient.dateOfBirth != null ? #temporals.format(patient.dateOfBirth, 'dd/MM/yyyy') : '---'}"></td>
                                        <td th:text="${patient.address}"></td>
                                        <td>
                                            <button class="btn btn-info btn-sm patient-calendar-btn" 
                                                    th:data-patient-id="${patient.id}"
                                                    th:data-patient-name="${patient.firstName + ' ' + patient.lastName}">
                                                <i class="mdi mdi-calendar"></i> Lịch khám
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- Pagination -->
                            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
                                <ul class="pagination justify-content-center">
                                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/patient(page=${currentPage - 1}, search=${search})}">
                                            Trước
                                        </a>
                                    </li>
                                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                        th:classappend="${i == currentPage} ? 'active'">
                                        <a class="page-link" th:href="@{/admin/patient(page=${i}, search=${search})}" th:text="${i + 1}"></a>
                                    </li>
                                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                        <a class="page-link" th:href="@{/admin/patient(page=${currentPage + 1}, search=${search})}">
                                            Sau
                                        </a>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Patient Calendar Modal -->
        <div class="modal fade" id="patientCalendarModal" tabindex="-1" aria-labelledby="patientCalendarModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="patientCalendarModalLabel">
                            <i class="mdi mdi-calendar"></i> Lịch khám bệnh - <span id="patientName"></span>
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="d-flex flex-wrap mb-3">
                            <div class="legend-item">
                                <span class="legend-color" style="background-color:#ffcc00;"></span>
                                Chờ xác nhận
                            </div>
                            <div class="legend-item">
                                <span class="legend-color" style="background-color:#ff4d4d;"></span>
                                Đã hủy
                            </div>
                            <div class="legend-item">
                                <span class="legend-color" style="background-color:#66cc66;"></span>
                                Đã khám
                            </div>
                            <div class="legend-item">
                                <span class="legend-color" style="background-color:#3399ff;"></span>
                                Chờ khám
                            </div>
                        </div>
                        <div id="calendar" style="height: 500px;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Appointment Details Modal -->
        <div class="modal fade" id="appointmentModal" tabindex="-1" aria-labelledby="appointmentModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="appointmentModalLabel">Chi tiết lịch khám</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="appointmentDetails">
                        <!-- Content will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<!-- Scripts -->
<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script th:src="@{/assets_admin/js/hoverable-collapse.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
    let patientCalendar;

    document.addEventListener('DOMContentLoaded', function() {
        // Initialize calendar but don't render yet
        var calendarEl = document.getElementById('calendar');
        patientCalendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            height: 'auto',
            events: [],
            eventClick: function(info) {
                showAppointmentDetails(info.event);
            }
        });

        // Add event delegation for patient calendar buttons
        document.addEventListener('click', function(e) {
            if (e.target.closest('.patient-calendar-btn')) {
                const button = e.target.closest('.patient-calendar-btn');
                const patientId = button.getAttribute('data-patient-id');
                const patientName = button.getAttribute('data-patient-name');
                openPatientCalendar(patientId, patientName);
            }
        });
    });

    function openPatientCalendar(patientId, patientName) {
        // Set patient name in modal title
        document.getElementById('patientName').textContent = patientName;
        
        // Show modal using Bootstrap 5
        const modal = new bootstrap.Modal(document.getElementById('patientCalendarModal'));
        modal.show();
        
        // Render calendar when modal is shown
        document.getElementById('patientCalendarModal').addEventListener('shown.bs.modal', function () {
            if (!patientCalendar._isRendered) {
                patientCalendar.render();
            }
            loadPatientAppointments(patientId);
        });
    }

    function loadPatientAppointments(patientId) {
        fetch(`/admin/patient/${patientId}/appointments`)
            .then(response => response.json())
            .then(appointments => {
                const events = appointments.map(appt => {
                    let color;
                    switch(appt.status) {
                        case -1: color = '#ffcc00'; break; // Waiting
                        case 0: color = '#ff4d4d'; break;  // Cancelled
                        case 1: color = '#66cc66'; break;  // Completed
                        case 2: color = '#3399ff'; break;  // Pending
                        default: color = '#808080';
                    }
                    
                    return {
                        title: '.',
                        start: appt.appointmentDateTime,
                        backgroundColor: color,
                        borderColor: color,
                        extendedProps: {
                            id: appt.id,
                            doctor: appt.doctorName || 'Chưa phân công',
                            room: appt.roomName || 'Chưa phân công',
                            status: appt.status,
                            reason: appt.reason
                        }
                    };
                });

                patientCalendar.removeAllEvents();
                patientCalendar.addEventSource(events);
            })
            .catch(error => console.error('Error loading appointments:', error));
    }

    function showAppointmentDetails(event) {
        const props = event.extendedProps;
        let statusText;
        switch(props.status) {
            case -1: statusText = 'Chờ xác nhận'; break;
            case 0: statusText = 'Đã hủy'; break;
            case 1: statusText = 'Đã khám'; break;
            case 2: statusText = 'Chờ khám'; break;
            default: statusText = 'Không xác định';
        }

        // Thêm nút xem hồ sơ bệnh án cho lịch khám đã hoàn thành
        let medicalRecordButton = '';
        if (props.status === 1) {
            medicalRecordButton = `
                <div class="mt-3">
                    <a href="/admin/patient/medical-record/${props.id}" class="btn btn-success btn-sm" target="_blank">
                        <i class="mdi mdi-file-document"></i> Xem hồ sơ bệnh án
                    </a>
                </div>
            `;
        }

        const content = `
            <div class="p-3">
                <p><strong>Lý do khám:</strong> ${props.reason}</p>
                <p><strong>Thời gian:</strong> ${event.start.toLocaleString()}</p>
                <p><strong>Bác sĩ:</strong> ${props.doctor}</p>
                <p><strong>Phòng:</strong> ${props.room}</p>
                <p><strong>Trạng thái:</strong> ${statusText}</p>
                ${medicalRecordButton}
            </div>
        `;

        document.getElementById('appointmentDetails').innerHTML = content;
        const detailModal = new bootstrap.Modal(document.getElementById('appointmentModal'));
        detailModal.show();
    }
</script>
</body>
</html>
