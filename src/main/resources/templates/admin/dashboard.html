<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Purple Admin</title>
    <!-- plugins:css -->
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
</head>
<body>
<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header">
            <h3 class="page-title">
              <span class="page-title-icon bg-gradient-primary text-white me-2">
                <i class="mdi mdi-home"></i>
              </span> Trang quản trị
            </h3>
            <nav aria-label="breadcrumb">
                <ul class="breadcrumb">
                    <li class="breadcrumb-item active" aria-current="page">
                        <span></span>Tổng quan <i
                            class="mdi mdi-alert-circle-outline icon-sm text-primary align-middle"></i>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="row">
            <div class="col-md-4 stretch-card grid-margin">
                <div class="card bg-gradient-danger card-img-holder text-white">
                    <div class="card-body">
                        <img th:src="@{/assets_admin/images/dashboard/circle.svg}" class="card-img-absolute"
                             alt="circle-image"/>
                        <h4 class="font-weight-normal mb-3">Số bệnh nhân hiện tại <i
                                class="mdi mdi-chart-line mdi-24px float-right"></i>
                        </h4>
                        <a th:href="@{/admin/patient}" style="text-decoration: none; color: white;">
                            <h2 class="mb-5"><span th:text="${countPatient}"></span></h2>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 stretch-card grid-margin">
                <div class="card bg-gradient-info card-img-holder text-white">
                    <div class="card-body">
                        <img th:src="@{/assets_admin/images/dashboard/circle.svg}" class="card-img-absolute"
                             alt="circle-image"/>
                        <h4 class="font-weight-normal mb-3">Số bác sĩ <i
                                class="mdi mdi-bookmark-outline mdi-24px float-right"></i>
                        </h4>
                        <a th:href="@{/admin/doctor}" style="text-decoration: none; color: white;">
                            <h2 class="mb-5"><span th:text="${countDoctor}"></span></h2>
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-md-4 stretch-card grid-margin">
                <div class="card bg-gradient-success card-img-holder text-white">
                    <div class="card-body">
                        <img th:src="@{/assets_admin/images/dashboard/circle.svg}" class="card-img-absolute"
                             alt="circle-image"/>
                        <h4 class="font-weight-normal mb-3">Số tài khoản <i
                                class="mdi mdi-diamond mdi-24px float-right"></i>
                        </h4>
                        <h2 class="mb-5"><span th:text="${countUser}"></span></h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-5">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title d-flex justify-content-between align-items-center">
                            Doanh thu theo ngày trong tháng
                            <span>
                        <button id="prevMonthBtn" class="btn btn-outline-primary btn-sm"><<</button>
                        <span id="revenueMonthLabel" class="mx-2"></span>
                        <button id="nextMonthBtn" class="btn btn-outline-primary btn-sm">>></button>
                    </span>
                        </h4>
                        <canvas id="dailyRevenueChart" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Lịch hẹn theo tháng trong năm</h4>
                        <canvas id="appointmentsBarChart" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Thống kê lịch hẹn trong tháng này</h4>
                        <canvas id="appointmentsPieChart" height="240"></canvas>
                    </div>
                </div>
            </div>
        </div>




    </th:block>
</th:block>

<script>
    let currentMonth = new Date().getMonth(); // 0-based
    let currentYear = new Date().getFullYear();
    const monthNames = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6",
        "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
    let revenueChart;

    function loadRevenueChart(month, year) {
        fetch(`/admin/api/revenue/daily?month=${month + 1}&year=${year}`)
            .then(res => res.json())
            .then(data => {
                const labels = [];
                const values = [];

                for (let i = 1; i <= 31; i++) {
                    labels.push(i.toString());
                    let found = data.find(item => item.day == i);
                    values.push(found ? found.revenue : 0);
                }

                if (revenueChart) {
                    revenueChart.data.labels = labels;
                    revenueChart.data.datasets[0].data = values;
                    revenueChart.update();
                } else {
                    revenueChart = new Chart(document.getElementById("dailyRevenueChart"), {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Doanh thu (VND)',
                                data: values,
                                backgroundColor: '#00c292'
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value.toLocaleString("vi-VN") + ' đ';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }

                document.getElementById("revenueMonthLabel").textContent = monthNames[month] + ' - ' + year;
            });
    }

    document.getElementById("prevMonthBtn").addEventListener("click", () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        loadRevenueChart(currentMonth, currentYear);
    });

    document.getElementById("nextMonthBtn").addEventListener("click", () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        loadRevenueChart(currentMonth, currentYear);
    });

    loadRevenueChart(currentMonth, currentYear);
</script>

<script th:inline="javascript">
    let barChartRawData = /*[[${appointmentsByMonth}]]*/ [];
    let barLabels = [];
    let barData = [];

    barChartRawData.forEach(item => {
        barLabels.push('Tháng ' + item[0]);
        barData.push(item[1]);
    });

    new Chart(document.getElementById("appointmentsBarChart"), {
        type: 'bar',
        data: {
            labels: barLabels,
            datasets: [{
                label: 'Số lịch hẹn',
                data: barData,
                backgroundColor: '#4b49ac'
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'Số lượng'
                    }
                }
            }
        }
    });

    let pieChartRawData = /*[[${appointmentsPie}]]*/ [];
    let pieLabelsMap = {
        '-1': 'Chờ xác nhận',
        '0': 'Đã hủy',
        '1': 'Đã khám',
        '2': 'Chờ khám'
    };

    let pieLabels = [];
    let pieData = [];

    pieChartRawData.forEach(item => {
        let status = item[0];
        pieLabels.push(pieLabelsMap[status]);
        pieData.push(item[1]);
    });

    new Chart(document.getElementById("appointmentsPieChart"), {
        type: 'pie',
        data: {
            labels: pieLabels,
            datasets: [{
                data: pieData,
                backgroundColor: ['#ffc107', '#dc3545', '#28a745', '#17a2b8']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom'
                }
            }
        }
    });
</script>
<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/vendors/chart.js/Chart.min.js}"></script>
<script th:src="@{/assets_admin/js/jquery.cookie.js}" type="text/javascript"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script th:src="@{/assets_admin/js/hoverable-collapse.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
<script th:src="@{/assets_admin/js/dashboard.js}"></script>
<script th:src="@{/assets_admin/js/todolist.js}"></script>
</body>
</html>
