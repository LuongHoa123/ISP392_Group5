<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${shift.id} != null ? 'Sửa ca trực' : 'Thêm ca trực'">Form Shift</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 th:text="${shift.id} != null ? 'Sửa ca trực' : 'Thêm ca trực'"></h3>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{${shift.id} != null ? '/admin/shift/edit/' + ${shift.id} : '/admin/shift/add'}"
                  th:object="${shift}" method="post">

                <div class="form-group">
                    <label for="shiftDate">Ngày làm việc:</label>
                    <input type="date" id="shiftDate" name="shiftDate" class="form-control"
                           th:value="${#temporals.format(shift.startTime, 'yyyy-MM-dd')}" required/>
                </div>

                <div class="form-group">
                    <label for="fixedTime">Khung giờ:</label>
                    <select id="fixedTime" name="fixedTime" class="form-control" required>
                        <option value="">-- Chọn khung giờ --</option>
                        <option value="MORNING"
                                th:selected="${#temporals.format(shift.startTime, 'HH:mm') == '07:00'}">Sáng (07:00 -
                            11:00)
                        </option>
                        <option value="AFTERNOON"
                                th:selected="${#temporals.format(shift.startTime, 'HH:mm') == '13:00'}">Chiều (13:00 -
                            17:00)
                        </option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="description">Mô tả:</label>
                    <textarea id="description" class="form-control" th:field="*{description}"></textarea>
                </div>

                <div class="form-group">
                    <label for="doctor">Bác sĩ:</label>
                    <select id="doctor" class="form-control" th:field="*{doctor}">
                        <option value="">-- Chọn bác sĩ --</option>
                        <option th:each="d : ${doctors}" th:value="${d.id}"
                                th:text="${d.firstName + ' ' + d.lastName}">Doctor
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nurse">Y tá:</label>
                    <select id="nurse" class="form-control" th:field="*{nurse}">
                        <option value="">-- Chọn y tá --</option>
                        <option th:each="n : ${nurses}" th:value="${n.id}"
                                th:text="${n.firstName + ' ' + n.lastName}">Nurse
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Lưu</button>
                <a th:href="@{/admin/shift}" class="btn btn-secondary">Hủy</a>
            </form>
        </div>
    </th:block>
</th:block>


<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script>
    const doctorSelect = document.getElementById("doctor");
    const nurseSelect = document.getElementById("nurse");

    doctorSelect.addEventListener("change", function () {
        if (this.value) {
            nurseSelect.disabled = true;
        } else {
            nurseSelect.disabled = false;
        }
    });

    nurseSelect.addEventListener("change", function () {
        if (this.value) {
            doctorSelect.disabled = true;
        } else {
            doctorSelect.disabled = false;
        }
    });
</script>
</body>
</html>
