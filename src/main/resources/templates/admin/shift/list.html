<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý lịch trực</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- FullCalendar v5 -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

</head>
<body>

<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div class="container mt-5">
            <h3>Quản lý lịch trực</h3>
            <div id="calendar"></div>
        </div>


        <!-- Modal Form Ca Trực -->
        <div class="modal fade" id="shiftModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <form id="shiftForm" method="post" th:action="@{/admin/shift/save}">
                    <input type="hidden" name="id" id="shiftId"/>
                    <input type="hidden" name="date" id="shiftDate"/>

                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalTitle">Thêm ca trực</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="mb-3">
                                <label>Khung giờ</label>
                                <select name="fixedTime" id="fixedTime" class="form-select" required>
                                    <option value="MORNING">Sáng (07:00 - 11:00)</option>
                                    <option value="AFTERNOON">Chiều (13:00 - 17:00)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Bác sĩ</label>
                                <select name="doctorId" id="doctorSelect" class="form-select">
                                    <option value="">-- Chọn bác sĩ --</option>
                                    <option th:each="d : ${doctors}" th:value="${d.id}"
                                            th:text="${d.firstName + ' ' + d.lastName}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Y tá</label>
                                <select name="nurseId" id="nurseSelect" class="form-select">
                                    <option value="">-- Chọn y tá --</option>
                                    <option th:each="n : ${nurses}" th:value="${n.id}"
                                            th:text="${n.firstName + ' ' + n.lastName}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Lưu</button>
                            <button type="button" class="btn btn-danger" id="deleteShiftBtn" style="display:none;">Xoá
                            </button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </th:block>
</th:block>
<!-- JS Calendar -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        function showSuccessToast(message = "Thao tác thành công!") {
            const toastEl = document.getElementById('successToast');
            toastEl.querySelector('.toast-body').textContent = message;

            const toast = new bootstrap.Toast(toastEl);
            toast.show();
        }

        function showErrorToast(message) {
            const toastEl = document.getElementById('errorToast');
            toastEl.querySelector('.toast-body').textContent = message;
            new bootstrap.Toast(toastEl).show();
        }

        const calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
            initialView: 'dayGridMonth',
            locale: 'vi',
            selectable: true,

            dateClick: function (info) {
                openModalForAdd(info.dateStr);
            },

            eventClick: function (info) {
                openModalForEdit(info.event);
            },

            events: '/admin/shift/api'
        });

        calendar.render();

        function openModalForAdd(dateStr) {
            resetModal();
            document.getElementById('shiftDate').value = dateStr;
            document.getElementById('modalTitle').textContent = 'Thêm ca trực';
            document.getElementById('deleteShiftBtn').style.display = 'none';
            new bootstrap.Modal(document.getElementById('shiftModal')).show();
        }

        function openModalForEdit(event) {
            resetModal();
            document.getElementById('modalTitle').textContent = 'Sửa ca trực';

            document.getElementById('shiftId').value = event.id;

            document.getElementById('shiftDate').value = event.startStr;
            document.getElementById('fixedTime').value = event.extendedProps.fixedTime;
            document.getElementById('doctorSelect').value = event.extendedProps.doctorId || '';
            document.getElementById('nurseSelect').value = event.extendedProps.nurseId || '';

            document.getElementById('deleteShiftBtn').style.display = 'inline-block';
            new bootstrap.Modal(document.getElementById('shiftModal')).show();
        }


        function resetModal() {
            document.getElementById('shiftForm').reset();
            document.getElementById('shiftId').value = '';
        }

        document.getElementById('deleteShiftBtn').addEventListener('click', function () {
            const id = document.getElementById('shiftId').value;
            if (confirm('Bạn có chắc muốn xoá ca trực này?')) {
                fetch('/admin/shift/api/delete/' + id, {method: 'POST'})
                    .then(() => {
                        bootstrap.Modal.getInstance(document.getElementById('shiftModal')).hide();
                        calendar.refetchEvents();
                        showSuccessToast("Xoá ca trực thành công!");
                    });
            }
        });
        document.getElementById('shiftForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const formData = new FormData(this);

            fetch('/admin/shift/api/save', {
                method: 'POST',
                body: formData
            })
                .then(async response => {
                    if (!response.ok) {
                        const errorMessage = await response.text();
                        showErrorToast(errorMessage);
                        return;
                    }

                    bootstrap.Modal.getInstance(document.getElementById('shiftModal')).hide();
                    calendar.refetchEvents();
                    showSuccessToast("Lưu ca trực thành công!");
                })
                .catch(error => {
                    console.error('Lỗi mạng hoặc lỗi khác:', error);
                    showErrorToast("Đã xảy ra lỗi, vui lòng thử lại.");
                });
        });

    });
</script>
<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1100">
    <div id="successToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                Thao tác thành công!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>

    <div id="errorToast" class="toast bg-danger text-white" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-body">Có lỗi!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>

</div>



</body>
</html>
