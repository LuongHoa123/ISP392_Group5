<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý lịch làm việc</title>

    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- FullCalendar v5 -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>

</head>
<body>

<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <div class="container mt-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Quản lý lịch trực</h3>
                <a href="/admin/shift/statistics" class="btn btn-info">
                    <i class="mdi mdi-chart-bar"></i> Xem thống kê lịch làm việc
                </a>
            </div>
            <div id="calendar"></div>
        </div>


        <!-- Modal Form Ca Trực -->
        <div class="modal fade" id="shiftModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <form id="shiftForm" method="post" th:action="@{/admin/shift/save}">
                    <input type="hidden" name="id" id="shiftId"/>
                    <input type="hidden" name="date" id="shiftDate"/>

                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="modalTitle">Thêm ca trực</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="mb-3">
                                <label>Khung giờ</label>
                                <select name="fixedTime" id="fixedTime" class="form-select" required>
                                    <option value="MORNING">Sáng (07:00 - 11:00)</option>
                                    <option value="AFTERNOON">Chiều (13:00 - 17:00)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Số phòng</label>
                                <select name="roomId" id="roomSelect" class="form-select">
                                    <option value="">-- Chọn phòng --</option>
                                    <option th:each="r : ${rooms}" th:value="${r.id}"
                                            th:text="${r.roomName + ' - ' + r.roomType + ' (Tầng ' + r.floor + ')'}"></option>
                                </select>
                                <small class="text-muted" id="roomSpecializationInfo"></small>
                            </div>

                            <div class="mb-3">
                                <label>Bác sĩ</label>
                                <select name="doctorId" id="doctorSelect" class="form-select">
                                    <option value="">-- Chọn bác sĩ --</option>
                                    <option th:each="d : ${doctors}" th:value="${d.id}"
                                            th:text="${d.firstName + ' ' + d.lastName + ' (' + d.specialization + ')'}"></option>
                                </select>
                                <small class="text-info" id="doctorSpecializationInfo"></small>
                            </div>

                            <div class="mb-3">
                                <label>Y tá</label>
                                <select name="nurseId" id="nurseSelect" class="form-select">
                                    <option value="">-- Chọn y tá --</option>
                                    <option th:each="n : ${nurses}" th:value="${n.id}"
                                            th:text="${n.firstName + ' ' + n.lastName}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">
                                <i class="mdi mdi-delete"></i> Xóa
                            </button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                            <button type="submit" class="btn btn-primary">Lưu</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const calendarEl = document.getElementById('calendar'); // ← Lấy div#calendar
                const modal = new bootstrap.Modal(document.getElementById('shiftModal'));
                const deleteBtn = document.getElementById('deleteBtn');

                const calendar = new FullCalendar.Calendar(calendarEl, { // ← Tạo calendar object
                    initialView: 'dayGridMonth',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,timeGridDay'
                    },
                    events: '/admin/shift/api',  // ← Load data từ API // ← Gọi API và nhận JSON
                    selectable: true,
                    select: function(info) {
                        openModal(null, info.startStr);   // ← Click ngày → Mở modal
                    },
                    eventClick: function(info) {
                        // Khi click vào event thì mở modal chỉnh sửa
                        openModal(info.event);
                    }
                });

                calendar.render(); // ← 🎯 RENDER CALENDAR VÀO DIV!

                function openModal(event, selectedDate = null) {
                    const form = document.getElementById('shiftForm');
                    form.reset();

                    if (event) {
                        // Edit mode - hiện nút xóa
                        document.getElementById('modalTitle').textContent = 'Chỉnh sửa ca trực';
                        document.getElementById('shiftId').value = event.id;
                        document.getElementById('shiftDate').value = event.start.toISOString();
                        document.getElementById('fixedTime').value = event.extendedProps.fixedTime;
                        document.getElementById('doctorSelect').value = event.extendedProps.doctorId || '';
                        document.getElementById('nurseSelect').value = event.extendedProps.nurseId || '';
                        document.getElementById('roomSelect').value = event.extendedProps.roomId || '';
                        deleteBtn.style.display = 'inline-block';
                        
                        // Gán sự kiện xóa cho nút delete
                        deleteBtn.onclick = function() {
                            if (confirm('Bạn có muốn xóa ca trực này không?')) {
                                deleteShift(event.id);
                            }
                        };
                    } else {
                        // Add mode - ẩn nút xóa
                        document.getElementById('modalTitle').textContent = 'Thêm ca trực';
                        document.getElementById('shiftId').value = '';
                        document.getElementById('shiftDate').value = selectedDate;
                        deleteBtn.style.display = 'none';
                        deleteBtn.onclick = null;
                    }

                    modal.show();
                }

                // Hàm xóa ca trực
                function deleteShift(shiftId) {
                    fetch('/admin/shift/api/delete/' + shiftId, {
                        method: 'POST'
                    })
                    .then(() => {
                        modal.hide();
                        calendar.refetchEvents();
                        alert('Xóa thành công!');
                    })
                    .catch(error => {
                        alert('Lỗi khi xóa: ' + error);
                    });
                }

                // Form submission
                document.getElementById('shiftForm').addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const formData = new FormData(this);
                    
                    fetch('/admin/shift/api/save', {
                        method: 'POST',
                        body: formData
                    })
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        } else {
                            return response.text().then(text => Promise.reject(text));
                        }
                    })
                    .then(data => {
                        modal.hide();
                        calendar.refetchEvents();
                        alert('Lưu thành công!');
                    })
                    .catch(error => {
                        alert('Lỗi: ' + error);
                    });
                });

                // Xử lý cập nhật danh sách bác sĩ khi chọn phòng
                document.getElementById('roomSelect').addEventListener('change', function() {
                    const roomId = this.value;
                    const doctorSelect = document.getElementById('doctorSelect');
                    const roomSpecializationInfo = document.getElementById('roomSpecializationInfo');
                    const doctorSpecializationInfo = document.getElementById('doctorSpecializationInfo');
                    
                    // Reset danh sách bác sĩ
                    doctorSelect.innerHTML = '<option value="">-- Chọn bác sĩ --</option>';
                    roomSpecializationInfo.textContent = '';
                    doctorSpecializationInfo.textContent = '';
                    
                    if (roomId) {
                        // Lấy danh sách bác sĩ phù hợp với phòng
                        fetch(`/admin/shift/api/doctors-by-room/${roomId}`)
                            .then(response => response.json())
                            .then(doctors => {
                                if (doctors.length > 0) {
                                    doctors.forEach(doctor => {
                                        const option = document.createElement('option');
                                        option.value = doctor.id;
                                        option.textContent = doctor.name + ' (' + doctor.specialization + ')';
                                        doctorSelect.appendChild(option);
                                    });
                                    
                                    // Hiển thị thông báo về chuyên khoa yêu cầu
                                    const roomType = this.options[this.selectedIndex].text;
                                    if (roomType.includes('Phòng tai')) {
                                        roomSpecializationInfo.textContent = 'Yêu cầu: Bác sĩ chuyên khoa Tai';
                                        doctorSpecializationInfo.textContent = 'Chỉ hiển thị bác sĩ chuyên khoa Tai';
                                    } else if (roomType.includes('Phòng mũi')) {
                                        roomSpecializationInfo.textContent = 'Yêu cầu: Bác sĩ chuyên khoa Mũi';
                                        doctorSpecializationInfo.textContent = 'Chỉ hiển thị bác sĩ chuyên khoa Mũi';
                                    } else if (roomType.includes('Phòng họng')) {
                                        roomSpecializationInfo.textContent = 'Yêu cầu: Bác sĩ chuyên khoa Họng';
                                        doctorSpecializationInfo.textContent = 'Chỉ hiển thị bác sĩ chuyên khoa Họng';
                                    } else if (roomType.includes('nội soi') || roomType.includes('thủ thuật')) {
                                        roomSpecializationInfo.textContent = 'Yêu cầu: Bác sĩ chuyên khoa Tai, Mũi hoặc Họng';
                                        doctorSpecializationInfo.textContent = 'Chỉ hiển thị bác sĩ chuyên khoa Tai, Mũi, Họng';
                                    } else {
                                        roomSpecializationInfo.textContent = 'Không có yêu cầu chuyên khoa cụ thể';
                                        doctorSpecializationInfo.textContent = 'Có thể chọn bất kỳ bác sĩ nào';
                                    }
                                } else {
                                    roomSpecializationInfo.textContent = 'Không có bác sĩ phù hợp cho phòng này';
                                    doctorSpecializationInfo.textContent = 'Vui lòng chọn phòng khác hoặc thêm bác sĩ chuyên khoa phù hợp';
                                }
                            })
                            .catch(error => {
                                console.error('Lỗi khi lấy danh sách bác sĩ:', error);
                                roomSpecializationInfo.textContent = 'Lỗi khi tải danh sách bác sĩ';
                            });
                    }
                });

                // Validation khi submit form
                document.getElementById('shiftForm').addEventListener('submit', function(e) {
                    const roomSelect = document.getElementById('roomSelect');
                    const doctorSelect = document.getElementById('doctorSelect');
                    
                    if (roomSelect.value && doctorSelect.value) {
                        const roomType = roomSelect.options[roomSelect.selectedIndex].text;
                        const doctorText = doctorSelect.options[doctorSelect.selectedIndex].text;
                        
                        // Kiểm tra xem bác sĩ có phù hợp với phòng không
                        if (roomType.includes('Phòng tai') && !doctorText.includes('(Tai)')) {
                            e.preventDefault();
                            alert('Bác sĩ được chọn không phù hợp với phòng Tai. Vui lòng chọn bác sĩ chuyên khoa Tai.');
                            return false;
                        } else if (roomType.includes('Phòng mũi') && !doctorText.includes('(Mũi)')) {
                            e.preventDefault();
                            alert('Bác sĩ được chọn không phù hợp với phòng Mũi. Vui lòng chọn bác sĩ chuyên khoa Mũi.');
                            return false;
                        } else if (roomType.includes('Phòng họng') && !doctorText.includes('(Họng)')) {
                            e.preventDefault();
                            alert('Bác sĩ được chọn không phù hợp với phòng Họng. Vui lòng chọn bác sĩ chuyên khoa Họng.');
                            return false;
                        } else if ((roomType.includes('nội soi') || roomType.includes('thủ thuật')) && 
                                   !doctorText.includes('(Tai)') && !doctorText.includes('(Mũi)') && !doctorText.includes('(Họng)')) {
                            e.preventDefault();
                            alert('Bác sĩ được chọn không phù hợp với phòng này. Vui lòng chọn bác sĩ chuyên khoa Tai, Mũi hoặc Họng.');
                            return false;
                        }
                    }
                });
            });
        </script>
    </th:block>
</th:block>
</body>
</html>
