<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Cập nhật Phòng Khám</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
</head>

<body>
<th:block th:replace="layout/admin-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header">
            <h3 class="page-title"> Cập nhật Phòng Khám </h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/admin/room}">Quản lý phòng</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Chỉnh sửa</li>
                </ol>
            </nav>
        </div>
        
        <div class="row">
            <div class="col-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Thông tin phòng</h4>

                        <!-- Debug information -->
                        <div class="alert alert-info" style="font-size: 12px;">
                            <strong>Debug:</strong> 
                            Room Name: <span th:text="${room.roomName}">N/A</span> | 
                            Floor: <span th:text="${room.floor}">N/A</span> | 
                            Room Type: <span th:text="${room.roomType}">N/A</span>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                            [[${errorMessage}]]
                        </div>
                        
                        <div th:if="${successMessage}" class="alert alert-success" role="alert">
                            [[${successMessage}]]
                        </div>

                        <form class="forms-sample"
                              th:action="@{'/admin/room/update/' + ${room.id}}"
                              th:object="${room}" method="post">

                            <div class="form-group">
                                <label for="floor">Tầng <span class="text-danger">*</span></label>
                                <select class="form-control" id="floorSelect" th:field="*{floor}" onchange="updateRoomOptions()" required>
                                    <option value="">Chọn tầng</option>
                                    <option value="1">Tầng 1</option>
                                    <option value="2">Tầng 2</option>
                                    <option value="3">Tầng 3</option>
                                    <option value="4">Tầng 4</option>
                                    <option value="5">Tầng 5</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('floor')}" th:errors="*{floor}"></div>
                            </div>

                            <div class="form-group">
                                <label for="roomName">Số phòng <span class="text-danger">*</span></label>
                                <select class="form-control" id="roomNameSelect" th:field="*{roomName}" required>
                                    <option value="">Chọn số phòng</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('roomName')}" th:errors="*{roomName}"></div>
                            </div>

                            <div class="form-group">
                                <label for="roomType">Loại phòng <span class="text-danger">*</span></label>
                                <select class="form-control" th:field="*{roomType}" required>
                                    <option value="">Chọn loại phòng</option>
                                    <option value="Phòng tai">Phòng khám tai</option>
                                    <option value="Phòng mũi">Phòng khám mũi</option>
                                    <option value="Phòng họng">Phòng khám họng</option>
                                    <option value="Phòng nội soi (tai - mũi/ họng)">Phòng nội soi (tai - mũi/ họng)</option>
                                    <option value="Phòng thủ thuật (hút mũi, lấy dị vật)">Phòng thủ thuật (hút mũi, lấy dị vật)</option>
                                    <option value="Phòng xét nghiệm">Phòng xét nghiệm</option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('roomType')}" th:errors="*{roomType}"></div>
                            </div>

                            <div class="form-group">
                                <label for="description">Mô tả</label>
                                <textarea class="form-control" th:field="*{description}" rows="3" placeholder="Mô tả chi tiết về phòng khám"></textarea>
                                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                            </div>

                            <button type="submit" class="btn btn-gradient-primary">Cập nhật</button>
                            <a th:href="@{/admin/room}" class="btn btn-light">Hủy</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
        function updateRoomOptions() {
            var floorSelect = document.getElementById('floorSelect');
            var roomSelect = document.getElementById('roomNameSelect');
            var selectedFloor = floorSelect.value;
            var currentRoomName = roomSelect.getAttribute('data-current-value') || '';
            
            if (selectedFloor) {
                // Generate room options for selected floor
                var roomOptions = '<option value="">Chọn số phòng</option>';
                for (var i = 1; i <= 5; i++) {
                    var roomNumber = 'P' + selectedFloor + (i < 10 ? '0' + i : i);
                    var selected = (roomNumber === currentRoomName) ? 'selected' : '';
                    roomOptions += '<option value="' + roomNumber + '" ' + selected + '>' + roomNumber + '</option>';
                }
                
                // Update room select options
                roomSelect.innerHTML = roomOptions;
                
                // Set the current value back if it matches the floor
                if (currentRoomName && currentRoomName.startsWith('P' + selectedFloor)) {
                    roomSelect.value = currentRoomName;
                }
            } else {
                roomSelect.innerHTML = '<option value="">Vui lòng chọn tầng trước</option>';
            }
        }

        // Initialize room options when page loads
        window.onload = function() {
            var roomSelect = document.getElementById('roomNameSelect');
            var floorSelect = document.getElementById('floorSelect');
            var roomTypeSelect = document.querySelector('select[name="roomType"]');
            
            var currentRoomValue = roomSelect.value;
            var currentFloorValue = floorSelect.value;
            
            console.log('=== EDIT FORM DEBUG ===');
            console.log('Current room value:', currentRoomValue);
            console.log('Current floor value:', currentFloorValue);
            console.log('Current room type:', roomTypeSelect ? roomTypeSelect.value : 'not found');
            
            // Store current room name for later use
            roomSelect.setAttribute('data-current-value', currentRoomValue);
            
            // If we have a current room value but no floor, extract floor from room name
            if (currentRoomValue && currentRoomValue.startsWith('P') && !currentFloorValue) {
                // Extract floor from room name: P101->1, P201->2, P301->3, etc.
                var floorNumber = currentRoomValue.substring(1, 2);
                
                console.log('Extracted floor from room name:', floorNumber);
                
                // Set floor value and trigger update
                floorSelect.value = floorNumber;
                updateRoomOptions();
            } else if (currentFloorValue) {
                // If floor is already set, just update room options
                console.log('Floor already set, updating room options');
                updateRoomOptions();
            }
        }
        </script>
    </th:block>
</th:block>

<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script th:src="@{/assets_admin/js/hoverable-collapse.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
</body>
</html>
