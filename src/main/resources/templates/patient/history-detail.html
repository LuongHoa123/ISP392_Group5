<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch Khám Bệnh</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        h3, h4 {
            font-size: 2rem;
            font-weight: bold;
        }
        .table th, .table td {
            font-size: 1.2rem;
        }
        .bg-light, .card-body, .border.rounded {
            font-size: 1.15rem;
        }
        .btn-lg {
            font-size: 1.3rem;
            padding: 0.75rem 2rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background-color: #1e40af;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s;
        }

        .back-to-top:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
<th:block th:replace="layout/user-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-5">
            <!-- Tiêu đề -->
            <h3 class="mb-4">Chuẩn đoán cho bệnh nhân:
                <span class="text-primary" th:text="${appointment.name}"></span>
                ngày <span th:text="${#temporals.format(appointment.appointmentDateTime, 'dd/MM/yyyy HH:mm')}"></span>
            </h3>

            <!-- Danh sách chuẩn đoán -->
            <div class="mb-5">
                <h4>Danh sách chuẩn đoán</h4>
                <table class="table table-striped">
                    <thead class="thead-light">
                    <tr>
                        <th>#</th>
                        <th>Nội dung</th>
                        <th>Giá tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="diagnosis, iterStat : ${appointment.diagnosisEntities}">
                        <td th:text="${iterStat.index + 1}"></td>
                        <td th:text="${diagnosis.content}"></td>
                        <td th:text="${diagnosis.price}" class="vnd-price"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="bg-light p-3 rounded d-flex justify-content-between align-items-center">
                            <strong>Tổng số tiền:</strong>
                            <span class="text-danger font-weight-bold vnd-price" th:text="${appointment.totalCost}"></span>
                        </div>
                    </div>
                    <div class="col-md-6 mt-3 mt-md-0">
                        <div class="bg-light p-3 rounded d-flex justify-content-between align-items-center">
                            <strong>Số tiền đã đóng:</strong>
                            <span class="text-success font-weight-bold vnd-price" th:text="${appointment.payCost}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kết luận -->
            <div class="mb-5">
                <h4>Kết luận cho lịch khám của
                    <span class="text-primary" th:text="${appointment.name}"></span>
                </h4>
                <div th:if="${appointment.conclusionEntity.id != null}">
                    <div class="border rounded p-3 bg-light">
                        <p><strong>Nội dung kết luận:</strong>
                            <span th:text="${appointment.conclusionEntity.content}"></span>
                        </p>
                        <p><strong>Đơn thuốc:</strong>
                            <span th:text="${appointment.conclusionEntity.prescription}"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- Lịch sử thanh toán -->
            <div class="mb-5">
                <h4 class="mb-3">Lịch sử thanh toán</h4>
                <div class="card">
                    <div class="card-body p-0">
                        <table class="table table-bordered mb-0">
                            <thead class="thead-dark">
                            <tr>
                                <th>#</th>
                                <th>Mã</th>
                                <th>Người thanh toán</th>
                                <th>SDT</th>
                                <th>Thời gian</th>
                                <th>Lễ tân</th>
                                <th>Số tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="appt, iterStat : ${appointment.invoiceEntities}">
                                <td th:text="${iterStat.index + 1}"></td>
                                <td th:text="${appt.vnpTxtRef}"></td>
                                <td th:text="${appt.fullName}"></td>
                                <td th:text="${appt.phone}"></td>
                                <td th:text="${#temporals.format(appt.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                                <td th:text="${appt.recep != null ? (appt.recep.firstName + ' '  + appt.recep.lastName) : '---'}"></td>
                                <td th:text="${appt.totalCost}" class="vnd-price"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Nút quay lại -->
            <div class="text-center mt-5">
                <a th:href="@{/patient/appointment/calendar}" class="btn btn-secondary btn-lg">
                    Quay lại
                </a>
            </div>
        </div>
        <a href="#" class="back-to-top" id="backToTop" title="Lên đầu trang">
            <i class="fas fa-chevron-up"></i>
        </a>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const dateInput = document.getElementById('appointmentDate');
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                const yyyy = tomorrow.getFullYear();
                const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const dd = String(tomorrow.getDate()).padStart(2, '0');
                const minDateStr = `${yyyy}-${mm}-${dd}`;

                dateInput.min = minDateStr;
            });
        </script>


        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const backToTopBtn = document.getElementById("backToTop");

                window.addEventListener("scroll", function () {
                    if (window.scrollY > 300) {
                        backToTopBtn.style.display = "block";
                    } else {
                        backToTopBtn.style.display = "none";
                    }
                });

                backToTopBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    window.scrollTo({top: 0, behavior: "smooth"});
                });
            });
        </script>
    </th:block>
</th:block>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll(".vnd-price").forEach(el => {
        const rawValue = parseFloat(el.innerText);
        el.innerText = new Intl.NumberFormat('vi-VN', {
            style: 'currency',
            currency: 'VND'
        }).format(rawValue);
    });
</script>
</body>
</html>
