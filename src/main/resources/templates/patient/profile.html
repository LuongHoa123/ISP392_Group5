<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cập nhật thông tin bệnh nhân - MediHeart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/assets/favicon.ico}" type="image/jpeg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        .update-profile {
            padding: 60px 0;
            background-color: #f8f9fa;
        }

        .update-profile .heading {
            text-align: center;
            margin-bottom: 40px;
            color: #007bff;
            font-size: 3.5rem;
            font-weight: bold;
        }

        .update-profile form {
            background-color: #fff;
            padding: 40px 40px 35px 40px;
            border-radius: 12px;
            box-shadow: 0 0 18px rgba(0, 0, 0, 0.13);
            max-width: 700px;
            margin: 0 auto;
        }

        .update-profile form h3 {
            color: #28a745;
            margin-bottom: 28px;
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
        }

        .update-profile form .form-control {
            margin-bottom: 22px;
            font-size: 1.15rem;
            padding: 14px 12px;
            height: auto;
        }

        .update-profile form label {
            font-size: 1.13rem;
            font-weight: 500;
        }

        .update-profile form .btn {
            background-color: #28a745;
            color: white;
            padding: 16px;
            width: 100%;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 6px;
        }

        .update-profile form .btn:hover {
            background-color: #1e7e34;
        }

        .update-profile form p.error-message {
            color: #dc3545;
            text-align: center;
        }

        .required-star {
            color: red;
        }

        .update-profile form .text-danger {
            font-size: 1rem;
        }

        .update-profile form .form-control#firstName,
        .update-profile form .form-control#lastName {
            font-size: 1.35rem;
            height: 56px;
            padding: 16px 16px;
        }

        .update-profile form label[for="firstName"],
        .update-profile form label[for="lastName"] {
            font-size: 1.25rem;
        }

        .update-profile form .btn[type="submit"] {
            font-size: 1.7rem;
            padding: 22px;
            height: 64px;
        }

        .update-profile form label[for="firstName"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="firstName"] .required-star {
            font-size: 1.3rem;
        }

        .update-profile form label[for="lastName"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="lastName"] .required-star {
            font-size: 1.3rem;
        }

        .update-profile form label[for="dateOfBirth"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="dateOfBirth"] .required-star {
            font-size: 1.3rem;
        }

        .update-profile form label[for="gender"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="gender"] .required-star {
            font-size: 1.3rem;
        }

        .update-profile form label[for="address"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="address"] .required-star {
            font-size: 1.3rem;
        }

        .update-profile form label[for="phone"] {
            font-size: 1.7rem;
            font-weight: 700;
        }

        .update-profile form label[for="phone"] .required-star {
            font-size: 1.3rem;
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background-color: #1e40af;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s;
        }

        .back-to-top:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
<th:block th:replace="layout/user-layout :: layout">
    <th:block th:fragment="pageContent">

        <section class="update-profile">
            <h1 class="heading">Cập nhật thông tin cá nhân</h1>

            <!-- Hiển thị thông báo nếu có lỗi hoặc thành công -->
            <div class="container mt-3" th:if="${param.success}">
                <div class="alert alert-success text-center">Cập nhật thông tin thành công!</div>
            </div>

            <div class="container mt-3" th:if="${param.error}">
                <div class="alert alert-danger text-center">Có lỗi xảy ra trong quá trình cập nhật thông tin!</div>
            </div>

            <form id="updateProfileForm" th:action="@{/patient/update}" method="post" th:object="${patient}"
                  enctype="multipart/form-data">
                <h3>Cập nhật thông tin</h3>

                <div class="row">
                    <!-- Cột trái: Ảnh đại diện -->
                    <div class="col-md-4 text-center">
                        <label class="font-weight-bold" for="avatarFile">Ảnh đại diện</label>
                        <input type="file" id="avatarFile" name="avatarFile" accept="image/*"
                               class="form-control mb-3"/>

                        <!-- Nếu có ảnh -->
                        <img id="avatarPreview"
                             th:if="${patient.avatar != null}"
                             th:src="@{${patient.avatar}}"
                             alt="Preview avatar"
                             style="max-width: 100%; border-radius: 8px; display: block; margin: auto;"/>

                        <!-- Nếu chưa có ảnh -->
                        <img id="avatarPreview"
                             th:if="${patient.avatar == null}"
                             src="#"
                             alt="Preview avatar"
                             style="max-width: 100%; border-radius: 8px; display: none; margin: auto;"/>
                    </div>

                    <!-- Cột phải: Form nhập thông tin -->
                    <div class="col-md-8">
                        <!-- Họ và Tên -->
                        <div class="form-group">
                            <label for="firstName">Họ<span class="required-star">*</span></label>
                            <input type="text" id="firstName" name="firstName" class="form-control"
                                   th:field="*{firstName}" required>
                            <div id="firstNameError" class="text-danger"></div>
                        </div>

                        <div class="form-group">
                            <label for="lastName">Tên<span class="required-star">*</span></label>
                            <input type="text" id="lastName" name="lastName" class="form-control" th:field="*{lastName}"
                                   required>
                            <div id="lastNameError" class="text-danger"></div>
                        </div>

                        <!-- Ngày sinh -->
                        <div class="form-group">
                            <label for="dateOfBirth">Ngày sinh<span class="required-star">*</span></label>
                            <input type="date" id="dateOfBirth" name="dateOfBirth" class="form-control"
                                   th:field="*{dateOfBirth}" required>
                            <div id="dateOfBirthError" class="text-danger"></div>
                        </div>

                        <!-- Giới tính -->
                        <div class="form-group">
                            <label for="gender">Giới tính<span class="required-star">*</span></label>
                            <select id="gender" name="gender" class="form-control" th:field="*{gender}" required>
                                <option value="">-- Chọn giới tính --</option>
                                <option value="MALE" th:selected="*{gender == 'MALE'}">Nam</option>
                                <option value="FEMALE" th:selected="*{gender == 'FEMALE'}">Nữ</option>
                            </select>
                            <div id="genderError" class="text-danger"></div>
                        </div>

                        <!-- Địa chỉ -->
                        <div class="form-group">
                            <label for="address">Địa chỉ<span class="required-star">*</span></label>
                            <input type="text" id="address" name="address" class="form-control" th:field="*{address}"
                                   required>
                            <div id="addressError" class="text-danger"></div>
                        </div>

                        <!-- Số điện thoại -->
                        <div class="form-group">
                            <label for="phone">Số điện thoại<span class="required-star">*</span></label>
                            <input type="text" id="phone" name="phone" class="form-control" th:field="*{phone}"
                                   required>
                            <div id="phoneError" class="text-danger"></div>
                        </div>

                        <button type="submit" class="btn btn-success">Cập nhật</button>
                    </div>
                </div>
            </form>

        </section>
        <style>
            .back-to-top {
                position: fixed;
                bottom: 30px;
                right: 30px;
                z-index: 1000;
                background-color: #1e40af;
                color: white;
                padding: 12px 16px;
                border-radius: 50%;
                font-size: 18px;
                cursor: pointer;
                display: none;
                box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
                transition: opacity 0.3s;
            }

            .back-to-top:hover {
                opacity: 0.8;
            }
        </style>
        <a href="#" class="back-to-top" id="backToTop" title="Lên đầu trang">
            <i class="fas fa-chevron-up"></i>
        </a>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const dateInput = document.getElementById('appointmentDate');
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                const yyyy = tomorrow.getFullYear();
                const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const dd = String(tomorrow.getDate()).padStart(2, '0');
                const minDateStr = `${yyyy}-${mm}-${dd}`;

                dateInput.min = minDateStr;
            });
        </script>


        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const backToTopBtn = document.getElementById("backToTop");

                window.addEventListener("scroll", function () {
                    if (window.scrollY > 300) {
                        backToTopBtn.style.display = "block";
                    } else {
                        backToTopBtn.style.display = "none";
                    }
                });

                backToTopBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    window.scrollTo({top: 0, behavior: "smooth"});
                });
            });
        </script>
    </th:block>
</th:block>

<script src="https://kit.fontawesome.com/cb8535f973.js" crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    // Validation khi submit form
    document.getElementById('updateProfileForm').addEventListener('submit', function (e) {
            // Clear previous error messages
            document.getElementById('firstNameError').textContent = '';
            document.getElementById('lastNameError').textContent = '';
            document.getElementById('phoneError').textContent = '';
            document.getElementById('dateOfBirthError').textContent = '';
            document.getElementById('genderError').textContent = '';
            document.getElementById('addressError').textContent = '';

            let isValid = true;

            // Validate First Name and Last Name
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const namePattern = /^[\p{L} .'-]+$/u; // Chỉ cho phép chữ, dấu chấm, dấu gạch nối và dấu nháy đơn

            if (!namePattern.test(firstName)) {
                document.getElementById('firstNameError').textContent = 'Họ và tên không hợp lệ! Vui lòng chỉ nhập chữ.';
                isValid = false;
            }
            if (!namePattern.test(lastName)) {
                document.getElementById('lastNameError').textContent = 'Họ và tên không hợp lệ! Vui lòng chỉ nhập chữ.';
                isValid = false;
            }

            // Validate Phone Number
            const phone = document.getElementById('phone').value;
            const phonePattern = /^[0-9]{10,11}$/;

            if (!phonePattern.test(phone)) {
                document.getElementById('phoneError').textContent = 'Số điện thoại không hợp lệ!';
                isValid = false;
            }

            // Validate Date of Birth
            const dateOfBirth = document.getElementById('dateOfBirth').value;
            if (!dateOfBirth) {
                document.getElementById('dateOfBirthError').textContent = 'Vui lòng nhập ngày sinh!';
                isValid = false;
            }

            // Validate Address
            const address = document.getElementById('address').value;
            if (address.length < 5) {
                document.getElementById('addressError').textContent = 'Địa chỉ phải có ít nhất 5 ký tự!';
                isValid = false;
            }

            // Validate Gender
            const gender = document.getElementById('gender').value;
            if (!gender) {
                document.getElementById('genderError').textContent = 'Vui lòng chọn giới tính!';
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
            }
        }
    );

    document.addEventListener("DOMContentLoaded", function () {
        const avatarInput = document.getElementById('avatarFile');
        const avatarPreview = document.getElementById('avatarPreview');

        avatarInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    avatarPreview.src = e.target.result;
                    avatarPreview.style.display = 'block';
                };

                reader.readAsDataURL(file);
            } else {
                avatarPreview.src = '#';
                avatarPreview.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>
