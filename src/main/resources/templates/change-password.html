<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu - Veritas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/assets/favicon.ico}" type="image/jpeg">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .change-password {
            padding: 50px 0;
            background-color: #f8f9fa;
        }

        .change-password .heading {
            text-align: center;
            margin-bottom: 30px;
            color: #007bff;
        }

        .change-password form {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            margin: 0 auto;
        }

        .change-password form h3 {
            color: #28a745;
            margin-bottom: 20px;
            text-align: center;
        }

        .change-password form .form-control {
            margin-bottom: 15px;
        }

        .change-password form .btn {
            background-color: #28a745;
            color: white;
            padding: 12px;
            width: 100%;
        }

        .change-password form .btn:hover {
            background-color: #1e7e34;
        }

        .change-password form p.error-message {
            color: #dc3545;
            text-align: center;
        }

        .required-star {
            color: red;
        }

        .change-password form .form-group label {
            font-size: 1.3em; /* Slightly larger font size for labels */
        }
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
            background-color: #1e40af;
            color: white;
            padding: 12px 16px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s;
        }

        .back-to-top:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
<th:block th:replace="layout/user-layout :: layout">
    <th:block th:fragment="pageContent">
        <section class="change-password">
            <h1 class="heading">Đổi mật khẩu</h1>

            <form th:action="@{/change-password}" method="post">
                <h3>Cập nhật mật khẩu</h3>

                <div class="container mt-3" th:if="${mess}">
                    <div class="alert alert-danger text-center" th:text="${mess}"></div>
                </div>

                <!-- Mật khẩu hiện tại -->
                <div class="form-group">
                    <label for="oldPassword">Mật khẩu hiện tại<span class="required-star">*</span></label>
                    <div class="input-group">
                        <input type="password" id="oldPassword" name="oldPassword" class="form-control" required>
                        <div class="input-group-append">
            <span class="input-group-text toggle-password" onclick="togglePassword('oldPassword', this)">
                <i class="fas fa-eye"></i>
            </span>
                        </div>
                    </div>
                </div>

                <!-- Mật khẩu mới -->
                <div class="form-group">
                    <label for="newPassword">Mật khẩu mới<span class="required-star">*</span></label>
                    <div class="input-group">
                        <input type="password" id="newPassword" name="newPassword" class="form-control" required>
                        <div class="input-group-append">
            <span class="input-group-text toggle-password" onclick="togglePassword('newPassword', this)">
                <i class="fas fa-eye"></i>
            </span>
                        </div>
                    </div>
                </div>

                <!-- Xác nhận mật khẩu -->
                <div class="form-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới<span class="required-star">*</span></label>
                    <div class="input-group">
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                               required>
                        <div class="input-group-append">
            <span class="input-group-text toggle-password" onclick="togglePassword('confirmPassword', this)">
                <i class="fas fa-eye"></i>
            </span>
                        </div>
                    </div>
                </div>


                <button type="submit" class="btn btn-success">Cập nhật</button>

                <p th:if="${error}" th:text="${error}" class="error-message"></p>
                <p th:if="${success}" th:text="${success}" class="text-success text-center mt-3"></p>
            </form>
        </section>
        <a href="#" class="back-to-top" id="backToTop" title="Lên đầu trang">
            <i class="fas fa-chevron-up"></i>
        </a>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const dateInput = document.getElementById('appointmentDate');
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                const yyyy = tomorrow.getFullYear();
                const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
                const dd = String(tomorrow.getDate()).padStart(2, '0');
                const minDateStr = `${yyyy}-${mm}-${dd}`;

                dateInput.min = minDateStr;
            });
        </script>


        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const backToTopBtn = document.getElementById("backToTop");

                window.addEventListener("scroll", function () {
                    if (window.scrollY > 300) {
                        backToTopBtn.style.display = "block";
                    } else {
                        backToTopBtn.style.display = "none";
                    }
                });

                backToTopBtn.addEventListener("click", function (e) {
                    e.preventDefault();
                    window.scrollTo({top: 0, behavior: "smooth"});
                });
            });
        </script>
    </th:block>
</th:block>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://kit.fontawesome.com/cb8535f973.js" crossorigin="anonymous"></script>
<script th:src="@{/js/script.js}"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        // Validate password before form submission
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{7,}$/;

        if (!passwordRegex.test(newPassword)) {
            alert("Mật khẩu phải có ít nhất 7 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt.");
            e.preventDefault();
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("Mật khẩu xác nhận không trùng khớp.");
            e.preventDefault();
        }
    });

    // Toggle the visibility of a password field
    // @param {string} fieldId - The ID of the password input field to toggle
    // @param {HTMLElement} iconElement - The element containing the eye icon
    // @returns {void}
    function togglePassword(fieldId, iconElement) {
        const input = document.getElementById(fieldId);
        const icon = iconElement.querySelector("i");

        if (input.type === "password") {
            input.type = "text"; // Show password
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password"; // Hide password
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
