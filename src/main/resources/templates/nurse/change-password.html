<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đổi mật khẩu - Y tá</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
    <style>
        .password-form {
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group label {
            font-weight: bold;
            color: #495057;
        }
        .required-star {
            color: red;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .alert {
            margin-top: 15px;
        }
        .password-requirements {
            font-size: 0.9em;
            color: #6c757d;
            margin-top: 5px;
        }
        .input-group-text {
            cursor: pointer;
        }
    </style>
</head>

<body>
<th:block th:replace="layout/nurse-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header">
            <h3 class="page-title">Đổi mật khẩu</h3>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/nurse/profile}">Thông tin cá nhân</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Đổi mật khẩu</li>
                </ol>
            </nav>
        </div>

        <div class="row">
            <div class="col-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Cập nhật mật khẩu</h4>
                        <p class="card-description">Vui lòng nhập thông tin để đổi mật khẩu</p>

                        <form class="password-form" th:action="@{/nurse/change-password}" method="post">
                            <!-- Thông báo lỗi -->
                            <div th:if="${error}" class="alert alert-danger" role="alert">
                                <i class="mdi mdi-alert-circle-outline"></i>
                                <span th:text="${error}"></span>
                            </div>

                            <!-- Thông báo thành công -->
                            <div th:if="${success}" class="alert alert-success" role="alert">
                                <i class="mdi mdi-check-circle-outline"></i>
                                <span th:text="${success}"></span>
                            </div>

                            <!-- Mật khẩu hiện tại -->
                            <div class="form-group">
                                <label for="oldPassword">Mật khẩu hiện tại<span class="required-star">*</span></label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" 
                                           placeholder="Nhập mật khẩu hiện tại" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text toggle-password" onclick="togglePassword('oldPassword', this)">
                                            <i class="mdi mdi-eye"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <!-- Mật khẩu mới -->
                            <div class="form-group">
                                <label for="newPassword">Mật khẩu mới<span class="required-star">*</span></label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="newPassword" name="newPassword" 
                                           placeholder="Nhập mật khẩu mới" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text toggle-password" onclick="togglePassword('newPassword', this)">
                                            <i class="mdi mdi-eye"></i>
                                        </span>
                                    </div>
                                </div>
                                <div class="password-requirements">
                                    <small>Mật khẩu phải có ít nhất 7 ký tự, bao gồm chữ hoa và ký tự đặc biệt (@$!%*?&)</small>
                                </div>
                            </div>

                            <!-- Xác nhận mật khẩu -->
                            <div class="form-group">
                                <label for="confirmPassword">Xác nhận mật khẩu mới<span class="required-star">*</span></label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                                           placeholder="Nhập lại mật khẩu mới" required>
                                    <div class="input-group-append">
                                        <span class="input-group-text toggle-password" onclick="togglePassword('confirmPassword', this)">
                                            <i class="mdi mdi-eye"></i>
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary mr-2">
                                    <i class="mdi mdi-content-save"></i> Cập nhật mật khẩu
                                </button>
                                <a th:href="@{/nurse/profile}" class="btn btn-light">
                                    <i class="mdi mdi-arrow-left"></i> Quay lại
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/off-canvas.js}"></script>
<script th:src="@{/assets_admin/js/hoverable-collapse.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>

<script>
    // Toggle password visibility
    function togglePassword(fieldId, iconElement) {
        const input = document.getElementById(fieldId);
        const icon = iconElement.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("mdi-eye");
            icon.classList.add("mdi-eye-off");
        } else {
            input.type = "password";
            icon.classList.remove("mdi-eye-off");
            icon.classList.add("mdi-eye");
        }
    }

    // Form validation
    document.querySelector("form").addEventListener("submit", function (e) {
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        // Kiểm tra mật khẩu theo yêu cầu: ít nhất 7 ký tự, có chữ hoa và ký tự đặc biệt
        const passwordRegex = /^(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{7,}$/;

        if (!passwordRegex.test(newPassword)) {
            alert("Mật khẩu phải có ít nhất 7 ký tự, bao gồm chữ hoa và ký tự đặc biệt (@$!%*?&).");
            e.preventDefault();
            return;
        }

        if (newPassword !== confirmPassword) {
            alert("Mật khẩu xác nhận không trùng khớp.");
            e.preventDefault();
        }
    });
</script>

</body>
</html>
