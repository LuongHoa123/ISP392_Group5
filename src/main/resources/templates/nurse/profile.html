<!DOCTYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đổi thông tin cá nhân y tá</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/mdi/css/materialdesignicons.min.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
    <link rel="shortcut icon" th:href="@{/assets_admin/images/favicon.ico}"/>
    <style>
        body, .form-control, .btn, .card-title, .page-title, label {
            font-size: 1.2rem !important; /* Increase font size for all text elements */
        }

        .btn-warning {
            background-color: #28a745 !important; /* Green background for change password button */
            border-color: #28a745 !important;
            color: #fff !important;
        }
        .btn-warning:hover {
            background-color: #218838 !important;
            border-color: #1e7e34 !important;
        }
    </style>
</head>

<body>
<th:block th:replace="layout/nurse-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="page-header d-flex justify-content-between align-items-center">
            <h3 class="page-title">Đổi thông tin cá nhân y tá</h3>
            <a class="btn btn-warning" th:href="@{/nurse/changePass}">
                <i class="mdi mdi-lock-reset"></i> Đổi mật khẩu
            </a>
        </div>

        <div class="row">
            <div class="col-12 grid-margin stretch-card">
                <div class="card">
                    <div class="card-body">
                        <h4 class="card-title">Thông tin của tôi</h4>
                        <div th:if="${param.success}" class="alert alert-success" role="alert">
                            Cập nhật thông tin thành công!
                        </div>

                        <div th:if="${param.phone}" class="alert alert-danger" role="alert">
                            Số điện thoại bị trùng!
                        </div>

                        <!-- ✅ Đã thêm enctype -->
                        <form id="updateProfileForm" th:action="@{/nurse/profile/save}" th:object="${nurse}"
                              method="post" enctype="multipart/form-data">

                            <div style="display: flex; align-items: flex-start; gap: 40px;">
                                <!-- Bên trái: Avatar -->
                                <div style="min-width: 200px; text-align: center;">
                                    <label for="avatarFile">Ảnh đại diện</label>
                                    <input type="file" id="avatarFile" name="avatarFile" accept="image/*"
                                           class="form-control mb-3"/>

                                    <img id="avatarPreview"
                                         th:if="${nurse.avatar != null}"
                                         th:src="@{${nurse.avatar}}"
                                         alt="Preview avatar"
                                         style="max-width: 200px; border-radius: 8px; display: block; margin: auto;"/>

                                    <img id="avatarPreview"
                                         th:if="${nurse.avatar == null}"
                                         src="#"
                                         alt="Preview avatar"
                                         style="max-width: 200px; border-radius: 8px; display: none; margin: auto;"/>
                                </div>

                                <div style="flex:1">
                                    <div class="form-group">
                                        <label for="firstName">Họ <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{firstName}" name="firstName"
                                               placeholder="Họ" required>
                                        <div id="firstNameError" class="text-danger"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="lastName">Tên <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{lastName}" name="lastName"
                                               placeholder="Tên" required>
                                        <div id="lastNameError" class="text-danger"></div>
                                    </div>

                                    <div class="form-group">
                                        <label for="phoneNumber">Số điện thoại <span
                                                class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}"
                                               name="phoneNumber"
                                               placeholder="Số điện thoại" required>
                                        <div id="phoneError" class="text-danger"></div>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary mt-3">Lưu</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>

<script th:src="@{/assets_admin/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/assets_admin/js/misc.js}"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("#updateProfileForm");

        form.addEventListener("submit", function (event) {
            let isValid = true;
            let message = "";

            document.getElementById('firstNameError').textContent = '';
            document.getElementById('lastNameError').textContent = '';
            document.getElementById('phoneError').textContent = '';

            const firstName = document.querySelector("[name='firstName']").value.trim();
            const namePattern = /^[a-zA-Z\s]+$/;
            if (!firstName) {
                document.getElementById('firstNameError').textContent = 'Họ không được để trống.';
                isValid = false;
            }

            const lastName = document.querySelector("[name='lastName']").value.trim();
            if (!lastName) {
                document.getElementById('lastNameError').textContent = 'Tên không được để trống.';
                isValid = false;
            } else if (!namePattern.test(lastName)) {
                document.getElementById('lastNameError').textContent = 'Tên không hợp lệ. Chỉ cho phép chữ.';
                isValid = false;
            }

            const phoneNumber = document.querySelector("[name='phoneNumber']").value.trim();
            const phonePattern = /^0\d{9}$/;
            if (!phoneNumber) {
                document.getElementById('phoneError').textContent = 'Số điện thoại không được để trống.';
                isValid = false;
            } else if (!phonePattern.test(phoneNumber)) {
                document.getElementById('phoneError').textContent = 'Số điện thoại không hợp lệ. Phải bắt đầu bằng số 0 và có 10 chữ số.';
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault();
            }
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
        const avatarInput = document.getElementById('avatarFile');
        const avatarPreview = document.getElementById('avatarPreview');

        avatarInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();

                reader.onload = function (e) {
                    avatarPreview.src = e.target.result;
                    avatarPreview.style.display = 'block';
                };

                reader.readAsDataURL(file);
            } else {
                avatarPreview.src = '#';
                avatarPreview.style.display = 'none';
            }
        });
    });

</script>


</body>
</html>
