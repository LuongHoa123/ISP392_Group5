<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dịch vụ</title>
    <link rel="stylesheet" th:href="@{/assets_admin/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/assets_admin/css/style.css}">
</head>
<body>
<div aria-live="polite" aria-atomic="true" class="position-relative">
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;">
        <div th:if="${param.save}" class="toast align-items-center text-white bg-success border-0" role="alert"
             aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Thêm thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.update}" class="toast align-items-center text-white bg-success border-0" role="alert"
             aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Cập nhật thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${param.delete}" class="toast align-items-center text-white bg-success border-0" role="alert"
             aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Xoá thành công!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>

        <div th:if="${error}" class="toast align-items-center text-white bg-danger border-0" role="alert"
             aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${error}">
                    Có lỗi xảy ra!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="layout/nurse-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="container mt-4">
            <h3 class="mb-3">Thông tin lịch hẹn: <span th:text="${appointment.name}"></span></h3>

            <div class="alert alert-info" th:if="${appointment.diagnosis != null}">
                <h5 class="mb-3">📝 Chuẩn đoán</h5>
                <p><strong>Nội dung:</strong> <span th:text="${appointment.diagnosis.content}"></span></p>
            </div>

            <!-- Thêm dịch vụ -->
            <form th:action="@{/nurse/service/{appointmentId}/add(appointmentId=${appointment.id})}" method="post"
                  th:if="${appointment.status != 1}">
                <div class="form-group">
                    <label for="service">Chọn dịch vụ:</label>
                    <select id="service" name="serviceId" class="form-control" onchange="updatePrice()" required>
                        <option value="">-- Chọn dịch vụ --</option>
                        <option th:each="s : ${services}"
                                th:value="${s.id}"
                                th:text="${s.content}"
                                th:attr="data-price=${s.price}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="content">Nội dung dịch vụ (nếu muốn sửa):</label>
                    <textarea name="content" id="content" class="form-control" rows="2"></textarea>
                </div>

                <div class="form-group">
                    <label for="price">Giá tiền (VND):</label>
                    <input id="price" type="text" class="form-control" readonly>
                </div>

                <button type="submit" class="btn btn-primary">Thêm dịch vụ</button>
            </form>

            <h4 class="mt-4">Danh sách dịch vụ đã thêm</h4>
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Tên dịch vụ</th>
                    <th>Nội dung</th>
                    <th>Giá</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="as, iterStat : ${appointmentServices}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${as.service.content}"></td>
                    <td th:text="${as.content}"></td>
                    <td th:text="${as.service.price + ' VND'}"></td>
                    <td>
                        <a th:href="@{/nurse/service/{appointmentId}/delete-service/{serviceId}(appointmentId=${appointment.id}, serviceId=${as.service.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Bạn có chắc muốn xoá dịch vụ này?')">
                            Xóa
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointmentServices)}">
                    <td colspan="5">Chưa có dịch vụ nào.</td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/nurse/patient}" class="btn btn-danger mt-3">Quay lại</a>
        </div>
    </th:block>
</th:block>

<script>
    function updatePrice() {
        const select = document.getElementById("service");
        const selected = select.options[select.selectedIndex];
        const price = selected.getAttribute("data-price");
        document.getElementById("price").value = price ? price + " VND" : "";
    }
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        var toastElList = [].slice.call(document.querySelectorAll('.toast'))
        toastElList.forEach(function (toastEl) {
            var toast = new bootstrap.Toast(toastEl)
            toast.show()
        })
    });
</script>
</body>
</html>
